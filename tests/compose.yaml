name: opsmesh-tests
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: opsmesh_test
      POSTGRES_USER: opsmesh_test
      POSTGRES_PASSWORD: isolated-test-password
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmesh_test -d opsmesh_test"]
      interval: 2s
      timeout: 2s
      retries: 30
