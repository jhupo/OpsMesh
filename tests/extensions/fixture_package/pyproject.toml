[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmesh-s8-acceptance"
version = "1.0.0"
requires-python = ">=3.11.8"

[project.entry-points."opsmesh.extensions"]
s8_acceptance = "s8_acceptance:exports"

[tool.setuptools]
py-modules = ["s8_acceptance", "s9_mcp", "s14_managed"]
