<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>兜风搭子 · 鹈鹕骑猪</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f3eee4;color:#354b40;font-family:system-ui,-apple-system,sans-serif;padding:24px}
    main{width:min(1060px,100%)}
    header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}
    .eyebrow{font-size:11px;letter-spacing:3px;margin:0 0 10px;color:#718272}
    h1{font-size:clamp(25px,4vw,42px);font-weight:600;letter-spacing:-1px;margin:0}
    .subtitle{font-size:13px;margin:0 0 5px;color:#718272}
    .stage{overflow:hidden;border-radius:24px;border:1px solid #dedfca;background:#e8f1dc;box-shadow:0 22px 65px #495d3910}
    svg{display:block;width:100%;height:auto}
    footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 2px;color:#788273;font-size:12px}
    button{border:1px solid #ccd3bd;background:transparent;color:#354b40;border-radius:30px;padding:9px 18px;font:inherit;cursor:pointer}
    button:hover{background:#e5e9dc}button:focus-visible{outline:3px solid #849e6d;outline-offset:4px}
    .ink{stroke:#414b43;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .runner{animation:bounce .66s ease-in-out infinite}
    .bird{transform-origin:475px 345px;animation:sway .66s ease-in-out infinite}
    .leg{transform-box:fill-box;transform-origin:50% 0;animation:trot .66s ease-in-out infinite}
    .leg.alternate{animation-delay:-.33s}
    .wing{transform-origin:467px 269px;animation:flap 1.32s ease-in-out infinite}
    .scarf{transform-origin:507px 223px;animation:scarf .66s ease-in-out infinite}
    .ear{transform-origin:650px 322px;animation:ear .66s ease-in-out infinite}
    .tail{transform-origin:326px 360px;animation:tail .66s ease-in-out infinite}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
    .shadow{transform-origin:490px 444px;animation:shadow .66s ease-in-out infinite}
    .clouds{animation:landscape 50s linear infinite}
    .hills{animation:landscape 24s linear infinite}
    .ground{animation:landscape 3.6s linear infinite}
    .puff{transform-box:fill-box;transform-origin:center;animation:dust 1.32s ease-out infinite}
    .puff.second{animation-delay:-.66s}
    .paused *{animation-play-state:paused!important}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes sway{0%,100%{transform:rotate(-2deg) translateY(-2px)}50%{transform:rotate(2deg) translateY(2px)}}
    @keyframes trot{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
    @keyframes flap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-12deg)}}
    @keyframes scarf{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-9deg)}}
    @keyframes ear{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}
    @keyframes tail{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg)}}
    @keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
    @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.2}50%{transform:scaleX(.88);opacity:.12}}
    @keyframes landscape{to{transform:translateX(-1000px)}}
    @keyframes dust{0%{opacity:0;transform:translate(10px,0) scale(.4)}20%{opacity:.6}100%{opacity:0;transform:translate(-65px,-25px) scale(1.6)}}
    @media(max-width:600px){body{padding:16px}header{align-items:start;flex-direction:column;gap:10px}.stage{border-radius:16px}footer{font-size:11px}}
    @media(prefers-reduced-motion:reduce){svg *{animation:none!important}}
  </style>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">LITTLE ADVENTURES / 001</p><h1>兜风搭子。</h1></div><p class="subtitle">一只鹈鹕，一头小猪，和一个不赶时间的下午。</p></header>
    <section class="stage" aria-label="鹈鹕骑猪动画">
      <svg id="scene" viewBox="0 0 1000 560" role="img" aria-labelledby="scene-title scene-desc">
        <title id="scene-title">鹈鹕骑着小猪去兜风</title>
        <desc id="scene-desc">戴绿色围巾的白色鹈鹕坐在粉色小猪背上。小猪迈着四条腿奔跑，田野向后移动，围巾随风飘动。</desc>
        <defs>
          <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e6efd9"/><stop offset="1" stop-color="#faf1d9"/></linearGradient>
          <g id="cloud-pattern" fill="#fffdf2"><path d="M70 115c-22-2-23-27-4-32 3-30 47-34 58-8 25-8 44 19 23 36z"/><path d="M590 160c-27 0-26-25-7-30 0-32 43-40 58-13 24-13 47 14 26 34z"/><path d="M850 90c-20 0-25-23-5-28 4-25 37-28 49-7 20-5 37 19 18 30z"/></g>
          <g id="hill-pattern"><path d="M0 352Q145 187 310 324Q470 220 640 330Q820 187 1000 352V420H0Z" fill="#c9d6b1"/><path d="M0 374Q170 273 340 359Q490 294 665 370Q855 277 1000 374V440H0Z" fill="#adc39a"/></g>
          <g id="grass-pattern" stroke-linecap="round"><g stroke="#abb88a" stroke-width="3"><path d="M40 481l6-10m0 10 7-5M235 468l-3-8m7 9 4-9M450 511l5-11m1 10 6-5M721 476l3-10m3 11 7-7M910 526l-3-9m7 9 6-9"/></g><g fill="#f6e9be"><ellipse cx="131" cy="514" rx="17" ry="3"/><ellipse cx="579" cy="464" rx="12" ry="3"/><ellipse cx="827" cy="508" rx="21" ry="3"/></g><g fill="#fff9df"><circle cx="371" cy="476" r="4"/><circle cx="780" cy="537" r="4"/></g></g>
        </defs>
        <rect width="1000" height="560" fill="url(#sky)"/>
        <circle cx="796" cy="109" r="47" fill="#f6d184"/><circle cx="796" cy="109" r="60" fill="none" stroke="#f6d184" opacity=".3"/>
        <g class="clouds"><use href="#cloud-pattern"/><use href="#cloud-pattern" x="1000"/></g>
        <g class="hills"><use href="#hill-pattern"/><use href="#hill-pattern" x="1000"/></g>
        <path d="M0 411Q250 391 500 411T1000 411V560H0Z" fill="#e4d6af"/>
        <path d="M0 433Q260 414 500 433T1000 433" fill="none" stroke="#f5e8c6" stroke-width="6"/>
        <g class="ground"><use href="#grass-pattern"/><use href="#grass-pattern" x="1000"/></g>
        <ellipse class="shadow" cx="490" cy="444" rx="171" ry="17" fill="#746c54"/>
        <g fill="#f9eed4"><circle class="puff" cx="322" cy="433" r="12"/><circle class="puff second" cx="300" cy="435" r="8"/></g>
        <g class="runner ink">
          <g fill="#cb8190"><g class="leg alternate"><path d="M399 382l-7 45q5 12 20 7l14-46z"/><path d="M392 427l20 7" fill="none" stroke-width="9"/></g><g class="leg"><path d="M548 383l-2 44q7 13 22 5l5-47z"/><path d="M547 428l20 4" fill="none" stroke-width="9"/></g></g>
          <path class="tail" d="M337 365c-37 4-51-27-31-35 16-6 26 18 12 27-12 9-27 2-31-7" fill="none" stroke="#be7486" stroke-width="8"/>
          <path d="M341 348c20-32 77-44 143-40 67 4 115 18 129 55 18 51-43 68-121 67-76 0-150-8-159-42-3-13-1-27 8-40z" fill="#edacb8"/>
          <path d="M355 369q52-43 131-39" fill="none" stroke="#f8c7cc" stroke-width="10"/>
          <g class="leg" fill="#edacb8"><path d="M369 389l-2 44q5 13 21 9l17-47"/><path d="M368 434l20 7" fill="none" stroke-width="9"/></g>
          <g class="leg alternate" fill="#edacb8"><path d="M526 395l4 40q8 14 23 5l9-48"/><path d="M532 436l20 3" fill="none" stroke-width="9"/></g>
          <path d="M558 338q14-46 61-39 54 7 56 61 0 44-48 45-41 2-61-20" fill="#f2b8c1"/>
          <path d="M583 316q-27-48-2-46 27 3 28 40" fill="#edacb8"/>
          <path class="ear" d="M628 317q-3-53 24-44 18 9-4 48z" fill="#edacb8"/>
          <path d="M642 309l8-22" fill="none" stroke="#ce889b" stroke-width="5"/>
          <ellipse cx="670" cy="364" rx="31" ry="24" fill="#e499a9"/>
          <path d="M661 360v8m18-8v8" stroke="#935c70" stroke-width="5"/>
          <ellipse class="eye" cx="619" cy="340" rx="4" ry="6" fill="#414b43" stroke="none"/>
          <ellipse cx="609" cy="359" rx="12" ry="7" fill="#e492a4" stroke="none"/>
          <path d="M624 380q9 7 16-2" fill="none" stroke-width="3"/>
          <path d="M423 315q48-14 97 5l-10 18q-42-14-85-5z" fill="#73937a"/>
          <g class="bird">
            <path d="M439 239q-37 8-58 44l35 2-13 20q35-1 53-26z" fill="#e1e2cc"/>
            <path d="M452 217q-43 6-45 53c-2 43 33 62 67 59 35-4 52-32 45-66l-7-47z" fill="#fffbee"/>
            <path d="M487 251c-3-30-18-54-12-88 4-23 22-41 43-38 27 4 34 30 23 50-12 22-15 33-13 63l-6 39" fill="#fffbee"/>
            <path d="M479 145l-6-13m14 4-1-16" fill="none"/>
            <path d="M535 158l127 20q-39 13-124 6z" fill="#efb95d"/>
            <path d="M538 184l115-5q-42 63-96 35-15-8-19-30z" fill="#e9a35c"/>
            <path d="M554 192q37 14 67-1" fill="none" stroke="#cf8d4d" stroke-width="2"/>
            <ellipse class="eye" cx="521" cy="151" rx="4" ry="5" fill="#414b43" stroke="none"/>
            <circle cx="509" cy="169" r="6" fill="#edc6aa" stroke="none"/>
            <path class="scarf" d="M504 219q-47-10-90-4l17 10-13 10q41 0 87 2z" fill="#779b79"/>
            <path d="M479 215q19 10 46 3l-1 16q-25 8-44-4z" fill="#91b08b"/>
            <path class="wing" d="M468 255q-48-20-44 19 6 32 44 28 17-1 18-15" fill="#ecebd9"/>
            <path d="M480 318l-2 25 23 3m-1-25 5 20 21 2" fill="none" stroke="#cb964f" stroke-width="6"/>
          </g>
        </g>
        <g fill="none" stroke="#fffaf0" stroke-width="3" stroke-linecap="round" opacity=".75"><path d="M273 260h35m-56 13h34M713 290h26"/></g>
      </svg>
    </section>
    <footer><span>目的地不重要，一起出发就好。</span><button id="toggle" type="button" aria-pressed="false" aria-controls="scene">暂停动画</button></footer>
  </main>
  <script>
    const toggle = document.getElementById('toggle');
    const scene = document.getElementById('scene');
    toggle.addEventListener('click', () => {
      const paused = scene.classList.toggle('paused');
      toggle.setAttribute('aria-pressed', String(paused));
      toggle.textContent = paused ? '继续兜风' : '暂停动画';
    });
  </script>
</body>
</html>
