[project]
name = "opsmesh-operator"
version = "0.1.0rc4"
description = "OpsMesh installation, release verification and host operations."
requires-python = ">=3.11.8"
dependencies = ["httpx>=0.28.0,<1.0.0", "pydantic>=2.12.0,<3.0.0", "packaging>=26.2,<27.0", "filelock>=3.20.0,<4.0.0"]

[project.optional-dependencies]
host = ["docker>=7.2.0,<8.0.0", "python-dotenv>=1.1.0,<2.0.0", "psycopg[binary]>=3.3.4"]

[project.scripts]
opsmesh = "opsmesh_operator.cli:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opsmesh_operator*"]
