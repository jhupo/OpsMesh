<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ChainCloud Agent Team backend architecture</title>
  <desc id="desc">Architecture diagram showing boss users, workspaces, AI teams, talent marketplace, OpenAI Agents runtime, Docker runtimes, self-hosted machines, Postgres, Redis, storage, approvals, and observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#edf4ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b5b7a"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .section { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 16px Inter, Segoe UI, Arial, sans-serif; fill: #172033; }
      .small { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: #526174; }
      .tiny { font: 400 12px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .card { fill: #ffffff; stroke: #dbe4ef; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .soft { fill: #f8fbff; stroke: #cfe0f2; stroke-width: 1.2; rx: 14; }
      .blue { fill: #eaf3ff; stroke: #8ab8f7; }
      .green { fill: #eafaf2; stroke: #7bd7a2; }
      .amber { fill: #fff7e6; stroke: #f2c46d; }
      .red { fill: #fff0f0; stroke: #ee8d8d; }
      .purple { fill: #f2edff; stroke: #b49af5; }
      .line { stroke: #3b5b7a; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7c8da1; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="64" y="70" class="title">ChainCloud Agent Team</text>
  <text x="64" y="102" class="subtitle">Backend control plane for bosses hiring AI employees, building teams, and running isolated agent work.</text>

  <rect x="60" y="150" width="250" height="180" class="card"/>
  <text x="88" y="190" class="section">Boss User</text>
  <rect x="90" y="218" width="178" height="36" class="soft blue"/>
  <text x="110" y="241" class="label">Company Owner</text>
  <text x="90" y="282" class="small">Creates workspaces, teams, tasks,</text>
  <text x="90" y="304" class="small">hires agents, approves risky work.</text>

  <rect x="390" y="135" width="470" height="260" class="card"/>
  <text x="420" y="178" class="section">Workspace = AI Company</text>
  <text x="420" y="205" class="small">Hard tenant boundary for users, files, agents, teams, runtimes, tools, and audit data.</text>
  <rect x="420" y="235" width="122" height="62" class="soft blue"/>
  <text x="442" y="261" class="label">HR Agent</text>
  <text x="438" y="281" class="tiny">finds talent</text>
  <rect x="558" y="235" width="122" height="62" class="soft green"/>
  <text x="580" y="261" class="label">Manager</text>
  <text x="574" y="281" class="tiny">plans work</text>
  <rect x="696" y="235" width="122" height="62" class="soft amber"/>
  <text x="716" y="261" class="label">Specialists</text>
  <text x="716" y="281" class="tiny">execute tasks</text>
  <rect x="420" y="318" width="398" height="48" class="soft"/>
  <text x="442" y="348" class="label">Departments and team roles define responsibilities</text>

  <rect x="940" y="135" width="285" height="260" class="card"/>
  <text x="972" y="178" class="section">Talent Market</text>
  <text x="972" y="207" class="small">Public agent listings from other users.</text>
  <rect x="972" y="235" width="220" height="44" class="soft purple"/>
  <text x="992" y="263" class="label">Search by role and skill</text>
  <rect x="972" y="294" width="220" height="44" class="soft purple"/>
  <text x="992" y="322" class="label">Hire isolated copy</text>
  <text x="972" y="364" class="small">No source workspace data or credentials are copied.</text>

  <rect x="1285" y="135" width="255" height="260" class="card"/>
  <text x="1315" y="178" class="section">Approvals</text>
  <rect x="1315" y="220" width="178" height="46" class="soft red"/>
  <text x="1335" y="249" class="label">Risky commands</text>
  <rect x="1315" y="286" width="178" height="46" class="soft red"/>
  <text x="1335" y="315" class="label">MCP writes</text>
  <text x="1315" y="362" class="small">Human decisions resume or fail runs.</text>

  <rect x="60" y="470" width="325" height="220" class="card"/>
  <text x="92" y="514" class="section">Product API</text>
  <text x="92" y="543" class="small">FastAPI, auth, workspace isolation, rate limits, security events.</text>
  <rect x="92" y="575" width="238" height="42" class="soft blue"/>
  <text x="112" y="602" class="label">Task orchestration APIs</text>
  <rect x="92" y="632" width="238" height="42" class="soft blue"/>
  <text x="112" y="659" class="label">Files, artifacts, operations</text>

  <rect x="455" y="470" width="320" height="220" class="card"/>
  <text x="487" y="514" class="section">Workers and Queue</text>
  <text x="487" y="543" class="small">Long-running work never runs inline in API requests.</text>
  <rect x="487" y="575" width="226" height="42" class="soft green"/>
  <text x="507" y="602" class="label">Redis jobs and locks</text>
  <rect x="487" y="632" width="226" height="42" class="soft green"/>
  <text x="507" y="659" class="label">Retries and dead letters</text>

  <rect x="845" y="470" width="325" height="220" class="card"/>
  <text x="877" y="514" class="section">Agent Runtime</text>
  <text x="877" y="543" class="small">Product-owned contract around OpenAI Agents SDK.</text>
  <rect x="877" y="575" width="230" height="42" class="soft purple"/>
  <text x="897" y="602" class="label">OpenAI Agents runner</text>
  <rect x="877" y="632" width="230" height="42" class="soft purple"/>
  <text x="897" y="659" class="label">Skills, tools, MCP allowlists</text>

  <rect x="1240" y="470" width="300" height="220" class="card"/>
  <text x="1272" y="514" class="section">Execution Isolation</text>
  <rect x="1272" y="550" width="212" height="42" class="soft amber"/>
  <text x="1292" y="577" class="label">Cloud Docker runtime</text>
  <rect x="1272" y="607" width="212" height="42" class="soft amber"/>
  <text x="1292" y="634" class="label">Self-hosted machines</text>
  <text x="1272" y="672" class="small">CPU, memory, network, file, and credential controls.</text>

  <rect x="160" y="790" width="320" height="130" class="card"/>
  <text x="192" y="833" class="section">Postgres</text>
  <text x="192" y="862" class="small">Durable source of truth:</text>
  <text x="192" y="886" class="small">workspaces, agents, teams, tasks, runs, audits.</text>

  <rect x="640" y="790" width="320" height="130" class="card"/>
  <text x="672" y="833" class="section">Redis</text>
  <text x="672" y="862" class="small">Queues, locks, idempotency, rate limiting, cache.</text>

  <rect x="1120" y="790" width="320" height="130" class="card"/>
  <text x="1152" y="833" class="section">Storage and Secrets</text>
  <text x="1152" y="862" class="small">Workspace files, artifacts, encrypted hosted</text>
  <text x="1152" y="886" class="small">MCP credentials, external vault references.</text>

  <path d="M310 240 C340 240 350 250 390 250" class="line"/>
  <path d="M860 255 C890 255 900 255 940 255" class="line"/>
  <path d="M1085 395 C1085 430 1008 430 1008 470" class="dash"/>
  <path d="M860 330 C1040 330 1110 330 1285 250" class="dash"/>
  <path d="M185 330 C185 410 220 420 220 470" class="line"/>
  <path d="M385 580 C415 580 425 580 455 580" class="line"/>
  <path d="M775 580 C805 580 815 580 845 580" class="line"/>
  <path d="M1170 580 C1200 580 1210 580 1240 580" class="line"/>
  <path d="M220 690 C220 750 300 750 320 790" class="line"/>
  <path d="M615 690 C615 750 735 750 800 790" class="line"/>
  <path d="M1008 690 C1008 750 1220 750 1280 790" class="line"/>
  <path d="M1390 690 C1390 750 1320 750 1280 790" class="line"/>
</svg>
