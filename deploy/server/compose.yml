name: opsmesh
include:
  - ../temporal/compose.yml
x-api: &api
  image: ${OPSMESH_API_IMAGE:?Set an attested API image digest}
  env_file: ${OPSMESH_ROOT:?Set installation root}/.env
  environment: &environment
    OPSMESH_DATABASE_URL: postgresql+psycopg://opsmesh:${OPSMESH_POSTGRES_PASSWORD:?Set database password}@postgres:5432/opsmesh
    OPSMESH_REDIS_URL: redis://redis:6379/0
    OPSMESH_TEMPORAL_ADDRESS: temporal:7233
    OPSMESH_STORAGE_ROOT: ${OPSMESH_ROOT}/data/storage
    OPSMESH_EXECUTION_SANDBOX_IMAGES: ${OPSMESH_EXECUTION_SANDBOX_IMAGES:?Set attested runtime images}
    OPSMESH_PLUGINS_ROOT: ${OPSMESH_ROOT}/plugins
    OPSMESH_BUILD_COMMIT: ${OPSMESH_BUILD_COMMIT:?Set attested build commit}
  volumes:
    - type: bind
      source: ${OPSMESH_ROOT}/data/storage
      target: ${OPSMESH_ROOT}/data/storage
    - ${OPSMESH_ROOT}/plugins:${OPSMESH_ROOT}/plugins
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: '10m', max-file: '3'}
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 256
  mem_limit: 2g
  cpus: 2
services:
  api:
    <<: *api
    depends_on:
      temporal-namespace: {condition: service_completed_successfully}
    environment:
      <<: *environment
      OPSMESH_SERVICE_NAME: opsmesh-api
      OPSMESH_API_BIND: '0.0.0.0'
      OPSMESH_API_PORT: '8000'
      OPSMESH_METRICS_HOST: '0.0.0.0'
      OPSMESH_METRICS_PORT: '9000'
    ports:
      - '${OPSMESH_API_BIND:-127.0.0.1}:${OPSMESH_API_PORT:-8000}:8000'
      - '127.0.0.1:${OPSMESH_METRICS_PORT:-9000}:9000'
    healthcheck:
      test: [CMD, python, -c, 'import os,urllib.request; prefix=os.environ.get("OPSMESH_API_PREFIX","/api/v1"); urllib.request.urlopen("http://127.0.0.1:8000"+prefix+"/health/ready", timeout=8).read()']
      interval: 5s
      timeout: 10s
      retries: 24
  worker:
    <<: *api
    image: ${OPSMESH_WORKER_IMAGE:?Set an attested Worker image digest}
    depends_on:
      temporal-namespace: {condition: service_completed_successfully}
    environment:
      <<: *environment
      OPSMESH_SERVICE_NAME: opsmesh-worker
    # Only the SDK sandbox Worker has daemon authority. Never expose this to API/runtimes.
    group_add: ['${OPSMESH_DOCKER_GID:?Set Docker socket group}']
    volumes:
      - type: bind
        source: ${OPSMESH_ROOT}/data/storage
        target: ${OPSMESH_ROOT}/data/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPSMESH_ROOT}/plugins:${OPSMESH_ROOT}/plugins:ro
  gateway:
    <<: *api
    depends_on:
      temporal-namespace: {condition: service_completed_successfully}
    environment:
      <<: *environment
      OPSMESH_SERVICE_NAME: opsmesh-gateway
    command: [opsmesh-server, gateway]
    ports: []
  migrate:
    <<: *api
    profiles: [maintenance]
    restart: 'no'
    command: [opsmesh-server, migrate]
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: opsmesh
      POSTGRES_DB: opsmesh
      POSTGRES_PASSWORD: ${OPSMESH_POSTGRES_PASSWORD}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U opsmesh -d opsmesh']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis_data:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  redis_data:
