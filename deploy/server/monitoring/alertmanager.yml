# Template-only configuration. Production startup uses the file generated by
# scripts/render-alertmanager-config.py and OPSMESH_ALERTMANAGER_CONFIG_FILE.
global:
  resolve_timeout: 5m

route:
  receiver: opsmesh-operators
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: opsmesh-operators
    webhook_configs:
      - url: https://replace-with-real-operator-webhook.invalid/alerts
        send_resolved: true
