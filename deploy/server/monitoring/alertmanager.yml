global:
  resolve_timeout: 5m

route:
  receiver: opsmesh-operators
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Keeps alerts visible in the Alertmanager UI until an operator adds a real route.
  - name: opsmesh-operators
