apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: opsmesh-prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: opsmesh-loki
    access: proxy
    url: http://127.0.0.1:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          datasourceUid: opsmesh-tempo
          matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]{32})"'
          url: '$${__value.raw}'

  - name: Tempo
    type: tempo
    uid: opsmesh-tempo
    access: proxy
    url: http://127.0.0.1:3200
    editable: false
    jsonData:
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: opsmesh-prometheus
      tracesToLogsV2:
        datasourceUid: opsmesh-loki
        filterByTraceID: true
        filterBySpanID: true
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service_name
