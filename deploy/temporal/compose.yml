# Persistent local Temporal, following temporalio/samples-server's supported images.
services:
  temporal-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: temporal
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${OPSMESH_TEMPORAL_POSTGRES_PASSWORD:-temporal-local}
    volumes:
      - temporal_postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/temporal.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U temporal]
      interval: 5s
      timeout: 3s
      retries: 30
  temporal-schema:
    image: temporalio/admin-tools:1.31.0
    environment:
      SQL_PASSWORD: ${OPSMESH_TEMPORAL_POSTGRES_PASSWORD:-temporal-local}
    entrypoint: [/bin/sh, /scripts/schema.sh]
    volumes: [./schema.sh:/scripts/schema.sh:ro]
    depends_on:
      temporal-postgres: {condition: service_healthy}
  temporal:
    image: temporalio/server:1.31.0
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${OPSMESH_TEMPORAL_POSTGRES_PASSWORD:-temporal-local}
      POSTGRES_SEEDS: temporal-postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig/opsmesh.yaml
    volumes:
      - ./dynamicconfig.yml:/etc/temporal/dynamicconfig/opsmesh.yaml:ro
    ports: ['127.0.0.1:7233:7233']
    depends_on:
      temporal-schema: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, nc, -z, localhost, '7233']
      interval: 5s
      timeout: 3s
      retries: 60
  temporal-namespace:
    image: temporalio/admin-tools:1.31.0
    entrypoint: [/bin/sh, /scripts/namespace.sh]
    environment:
      TEMPORAL_NAMESPACE: ${OPSMESH_TEMPORAL_NAMESPACE:-default}
    volumes: [./namespace.sh:/scripts/namespace.sh:ro]
    depends_on:
      temporal: {condition: service_healthy}
volumes:
  temporal_postgres:
