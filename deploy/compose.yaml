# Local deployment example. Explicitly initialize schema before starting api/worker.
name: opsmesh-dev
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: &application-environment
      OPSMESH_DATA_DIRECTORY: /var/lib/opsmesh
      OPSMESH_DATABASE_URL: ${OPSMESH_DATABASE_URL:?Set an async PostgreSQL URL using host postgres}
      OPSMESH_REDIS_URL: redis://redis:6379/0
      OPSMESH_WORKER_ENABLED: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPSMESH_ADMIN_PASSWORD: ${OPSMESH_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - opsmesh-data:/var/lib/opsmesh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["worker"]
    environment:
      <<: *application-environment
      OPSMESH_WORKER_ENABLED: "true"
    volumes:
      - opsmesh-data:/var/lib/opsmesh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opsmesh
      POSTGRES_DB: opsmesh
      POSTGRES_PASSWORD: ${OPSMESH_POSTGRES_PASSWORD:?Set OPSMESH_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmesh -d opsmesh"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  opsmesh-data:
