# Optional Docker deployment. The Linux installer defaults to native systemd.
name: opsmesh
services:
  api:
    image: ${OPSMESH_IMAGE:-opsmesh-local:current}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ${OPSMESH_ENV_FILE:-../.env}
    environment: &application-environment
      OPSMESH_DATA_DIRECTORY: /var/lib/opsmesh
      OPSMESH_HOST: 0.0.0.0
      OPSMESH_PORT: "8000"
      OPSMESH_DATABASE_URL: ${OPSMESH_DATABASE_URL:?Set an async PostgreSQL URL using host postgres}
      OPSMESH_REDIS_URL: redis://redis:6379/0
      OPSMESH_WORKER_ENABLED: "false"
      # Bootstrap is passed only to `compose run -e OPSMESH_ADMIN_PASSWORD ... init`.
      OPSMESH_ADMIN_PASSWORD: ""
    ports:
      - "${OPSMESH_BIND_HOST:-127.0.0.1}:${OPSMESH_PORT:-8000}:8000"
    volumes:
      - opsmesh-data:/var/lib/opsmesh
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    image: ${OPSMESH_IMAGE:-opsmesh-local:current}
    restart: unless-stopped
    env_file:
      - ${OPSMESH_ENV_FILE:-../.env}
    command: ["worker"]
    environment:
      <<: *application-environment
      OPSMESH_WORKER_ENABLED: "true"
    volumes:
      - opsmesh-data:/var/lib/opsmesh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsmesh
      POSTGRES_DB: opsmesh
      POSTGRES_PASSWORD: ${OPSMESH_POSTGRES_PASSWORD:?Set OPSMESH_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmesh -d opsmesh"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  opsmesh-data:
