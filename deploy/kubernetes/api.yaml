apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsmesh-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: opsmesh-api}
  template:
    metadata:
      labels: {app: opsmesh-api}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: opsmesh:0.3.1
          args: [serve, --host, 0.0.0.0]
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: opsmesh-settings}
            - secretRef: {name: opsmesh-secrets}
          env:
            - {name: OPSMESH_WORKER_ENABLED, value: "false"}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - {name: content, mountPath: /var/lib/opsmesh}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: content
          persistentVolumeClaim: {claimName: opsmesh-content}
        - name: temporary
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: opsmesh-api
spec:
  selector: {app: opsmesh-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opsmesh-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: opsmesh-api}
