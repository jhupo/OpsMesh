apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsmesh-coordinator
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsmesh-run
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opsmesh-run-coordinator
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opsmesh-run-coordinator
subjects:
  - kind: ServiceAccount
    name: opsmesh-coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opsmesh-run-coordinator
