apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsmesh-api
spec:
  template:
    spec:
      serviceAccountName: opsmesh-observer
      automountServiceAccountToken: true
      containers:
        - name: api
          env:
            - {name: OPSMESH_RUN_WORKER_MODE, value: kubernetes}
            - {name: OPSMESH_RUN_WORKER_IMAGE, value: "opsmesh:0.3.0"}
            - name: OPSMESH_KUBERNETES_WORKER
              value: >-
                {"namespace":"opsmesh","deployment_id":"opsmesh",
                 "service_account":"opsmesh-run","settings_secret":"opsmesh-run-settings",
                 "environment_secrets":["opsmesh-model-secrets"],"data_claim":"opsmesh-content"}
