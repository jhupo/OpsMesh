apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsmesh-observer
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opsmesh-run-observer
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opsmesh-run-observer
subjects:
  - kind: ServiceAccount
    name: opsmesh-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opsmesh-run-observer
