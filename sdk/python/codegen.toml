# OpsMesh SDK 分组与代码生成映射
#
# 平台 routes/schema 导出稳定 operation_id 的 OpenAPI 后，按本配置由
# scripts/generate_sdk_api.py 生成 src/opsmesh_sdk/api/*.py 业务客户端与 DTO。
# 本文件是生成的唯一输入约定；S3 只交付映射规则与传输合同，业务分组随对应
# 服务端步骤生成，不在本步宣称未实现的业务 API 可用。

## 生成边界
#
# - 生成物只放 src/opsmesh_sdk/api/，手写稳定合同不改：values.py、errors.py、
#   manifest.py、transport/、extensions/、host/。
# - 生成客户端可导入 transport.contracts、errors、values；不得反向导入
#   client、context、development。
# - 纯值类型经 [shared_values] 映射复用，不复制手写 DTO。
# - API 变更须重新导出平台 OpenAPI 并做一致性检查后才允许提交生成物。

[openapi]
source = "docs/openapi.json" # 由 scripts/export_api_docs.py 生成
default_prefix = "/api/v1"
error_model = "ErrorResponse"

# 每个分组对应一个资源族；operation_id 的第一段决定归属，其余段是子客户端与
# 方法名（list/get/create/update/delete 等稳定动作）。
[[clients]]
group = "identity"
target = "api/identity.py"

[[clients]]
group = "workspaces"
target = "api/workspaces.py"

[[clients]]
group = "capabilities"
target = "api/capabilities.py"

[[clients]]
group = "resources"
target = "api/resources.py"

[[clients]]
group = "execution"
target = "api/execution.py"

[[clients]]
group = "orchestration"
target = "api/orchestration.py"

[[clients]]
group = "extensions"
target = "api/extensions.py"

[[clients]]
group = "channels"
target = "api/channels.py"

[[clients]]
group = "governance"
target = "api/governance.py"

[[clients]]
group = "platform"
target = "api/platform.py"

# 游标分页端点的查询参数、游标字段与集合字段名。
[pagination]
cursor_parameter = "cursor"
cursor_field = "next_cursor"
page_field = "items"

# 流式端点的游标头、媒体类型与空闲上限。
[streaming]
event_cursor_header = "Last-Event-ID"
sse_content_type = "text/event-stream"
max_idle_seconds = 300

# 纯值映射：生成 DTO 中同名同义字段直接复用 SDK 手写类型，不生成副本。
[shared_values]
ResourceRef = "opsmesh_sdk.values"
ScopeRef = "opsmesh_sdk.values"
Cursor = "opsmesh_sdk.values"
Page = "opsmesh_sdk.values"
Usage = "opsmesh_sdk.values"
IdempotencyKey = "opsmesh_sdk.values"
TraceContext = "opsmesh_sdk.values"
FlowRunRef = "opsmesh_sdk.values"

# 统一错误响应体映射到 opsmesh_sdk.errors 的类型化错误。一个失败类别对应一个
# 类型化错误；服务端多个稳定码描述同一类别时在 errors.py 的别名表中归并，
# 本表登记全部可达码。
[errors]
unauthenticated = "AuthenticationError"
invalid_credentials = "AuthenticationError"
unauthorized = "AuthenticationError"
permission_denied = "AuthorizationError"
forbidden = "AuthorizationError"
policy_denied = "AuthorizationError"
user_disabled = "AuthorizationError"
not_found = "NotFoundError"
validation_failed = "ValidationError"
validation_error = "ValidationError"
invalid_argument = "ValidationError"
invalid_avatar = "ValidationError"
bad_request = "ValidationError"
payload_too_large = "ValidationError"
method_not_allowed = "ValidationError"
conflict = "ConflictError"
duplicate_user = "ConflictError"
invitation_state = "ConflictError"
quota_reservation = "ConflictError"
idempotency_key_reused = "ConflictError"
idempotency_resource_missing = "ConflictError"
rate_limited = "RateLimitError"
quota_exceeded = "RateLimitError"
capacity_exceeded = "RateLimitError"
idempotency_in_progress = "RateLimitError"
needs_attention = "UnknownEffectError"
unavailable = "TransportError"
service_unavailable = "TransportError"

# OpenAPI 无法忠实表达“任意图片类型”的二进制载荷：上传接受调用方声明的
# Content-Type，读取返回存储时的媒体类型。这两个方向在此显式登记，生成客户端
# 走传输层原始字节通道，其余操作一律按 JSON 编解码。
[[binary]]
operation = "identity.users.avatar.upload"
direction = "request"

[[binary]]
operation = "identity.users.avatar.read"
direction = "response"

# S5：能力包与资源内容的原始字节通道。能力包上传与资源内容写回接受调用方
# 声明的 Content-Type；包下载、版本内容与产物内容返回存储时的媒体类型。
[[binary]]
operation = "capabilities.experts.package.attach"
direction = "request"

[[binary]]
operation = "capabilities.teams.package.attach"
direction = "request"

[[binary]]
operation = "capabilities.mcp.package.attach"
direction = "request"

[[binary]]
operation = "capabilities.skills.package.attach"
direction = "request"

[[binary]]
operation = "capabilities.tools.package.attach"
direction = "request"

[[binary]]
operation = "capabilities.channels.package.attach"
direction = "request"

[[binary]]
operation = "capabilities.extensions.package.attach"
direction = "request"

[[binary]]
operation = "capabilities.versions.package.read"
direction = "response"

[[binary]]
operation = "resources.files.content.write"
direction = "request"

[[binary]]
operation = "resources.files.content.read"
direction = "response"

[[binary]]
operation = "resources.files.versions.content.read"
direction = "response"

[[binary]]
operation = "resources.artifacts.content.read"
direction = "response"
