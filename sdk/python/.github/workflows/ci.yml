name: SDK static checks and distributions
on:
  push:
    branches: [sdk]
  pull_request:
    branches: [sdk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --extra agents
      - run: uv run --no-sync ruff format --check src examples
      - run: uv run --no-sync ruff check src examples
      - run: uv run --no-sync mypy
      - run: uv build
      - run: uvx --from twine twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
