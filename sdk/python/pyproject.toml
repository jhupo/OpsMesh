[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmesh-sdk"
version = "0.1.0rc23"
description = "Independent client, extension and host contracts for the OpsMesh platform."
readme = "README.md"
license = "LGPL-3.0-only"
requires-python = ">=3.11.8"
dependencies = [
    "httpx>=0.28.0,<1.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    "pydantic>=2.10.0,<3.0.0",
]

[project.scripts]
opsmesh-sdk = "opsmesh_sdk.development.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.11,<3.0",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.uv]
package = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["opsmesh_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.mypy]
python_version = "3.11"
platform = "linux"
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src/opsmesh_sdk"]

[tool.importlinter]
root_package = "opsmesh_sdk"
include_external_packages = true

# V4 section 12.2 SDK rows: api, extensions, transport, host and the composing
# client/context/development layers form an acyclic graph.

[[tool.importlinter.contracts]]
id = "v4-sdk-transport-no-api"
name = "Transport implements the contracts without importing generated business clients"
type = "forbidden"
source_modules = ["opsmesh_sdk.transport"]
forbidden_modules = ["opsmesh_sdk.api", "opsmesh_sdk.client", "opsmesh_sdk.context"]

[[tool.importlinter.contracts]]
id = "v4-sdk-extensions-pure"
name = "Extension declarations are pure contracts over values, errors and manifest"
type = "forbidden"
source_modules = ["opsmesh_sdk.extensions"]
forbidden_modules = [
    "opsmesh_sdk.transport", "opsmesh_sdk.host",
    "opsmesh_sdk.client", "opsmesh_sdk.context", "opsmesh_sdk.development",
]

[[tool.importlinter.contracts]]
id = "v4-sdk-api-no-client"
name = "Generated business clients never import the composing client or context"
type = "forbidden"
source_modules = ["opsmesh_sdk.api"]
forbidden_modules = ["opsmesh_sdk.client", "opsmesh_sdk.context", "opsmesh_sdk.development"]

[[tool.importlinter.contracts]]
id = "v4-sdk-host-no-context"
name = "Host clients reuse generated orchestration types without importing the context"
type = "forbidden"
source_modules = ["opsmesh_sdk.host"]
forbidden_modules = ["opsmesh_sdk.context", "opsmesh_sdk.client", "opsmesh_sdk.development"]

[[tool.importlinter.contracts]]
id = "v4-sdk-no-server"
name = "The independent SDK never imports the server or reference sources"
type = "forbidden"
source_modules = ["opsmesh_sdk"]
forbidden_modules = [
    "opsmesh", "backup", "backup_2",
    "fastapi", "sqlalchemy", "temporalio", "redis",
]
