services:
  api:
    build:
      context: .
    image: chaincloud-agent-team-backend:local
    env_file:
      - .env
    environment:
      CHAINCLOUD_DATABASE_URL: postgresql+psycopg://chaincloud:${CHAINCLOUD_POSTGRES_PASSWORD:-chaincloud}@postgres:5432/chaincloud
      CHAINCLOUD_REDIS_URL: redis://redis:6379/0
      CHAINCLOUD_STORAGE_ROOT: /app/.chaincloud-storage
    ports:
      - "${CHAINCLOUD_API_PORT:-8000}:8000"
    volumes:
      - chaincloud_storage:/app/.chaincloud-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: chaincloud-agent-team-backend:local
    build:
      context: .
    env_file:
      - .env
    environment:
      CHAINCLOUD_DATABASE_URL: postgresql+psycopg://chaincloud:${CHAINCLOUD_POSTGRES_PASSWORD:-chaincloud}@postgres:5432/chaincloud
      CHAINCLOUD_REDIS_URL: redis://redis:6379/0
      CHAINCLOUD_STORAGE_ROOT: /app/.chaincloud-storage
      CHAINCLOUD_RUN_MIGRATIONS: "false"
    command: ["python", "-m", "backend.app.workers.cli"]
    volumes:
      - chaincloud_storage:/app/.chaincloud-storage
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chaincloud
      POSTGRES_USER: chaincloud
      POSTGRES_PASSWORD: ${CHAINCLOUD_POSTGRES_PASSWORD:-chaincloud}
    volumes:
      - chaincloud_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chaincloud_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chaincloud_postgres:
  chaincloud_redis:
  chaincloud_storage:
