[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmesh-example-consumer"
version = "0.6.0"
description = "Minimal OpsMesh consumer plugin example"
requires-python = ">=3.11"
dependencies = ["opsmesh==0.6.0"]

[tool.setuptools]
packages = ["example_consumer"]
package-dir = {example_consumer = "example_consumer"}

[tool.setuptools.package-data]
example_consumer = ["*.json"]
