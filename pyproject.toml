[[tool.importlinter.contracts]]
id = "v4-workspaces-notifications-isolated"
name = "Notifications stay on membership and shared database mechanisms"
type = "forbidden"
source_modules = ["opsmesh.workspaces.notifications"]
forbidden_modules = [
