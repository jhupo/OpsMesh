type = "forbidden"
source_modules = ["opsmesh.execution.runtime"]
forbidden_modules = ["opsmesh.execution.runs", "opsmesh.execution.sessions"]

[[tool.importlinter.contracts]]
id = "v4-identity-auth-isolated"
name = "Authentication reaches the profile owner only through injected contracts"
type = "forbidden"
source_modules = ["opsmesh.identity.auth"]
forbidden_modules = [
    "opsmesh.identity.users", "opsmesh.identity.quotas", "opsmesh.identity.invitations",
]

[[tool.importlinter.contracts]]
id = "v4-identity-users-service-no-auth"
name = "The users service never imports authentication; only its routes may"
type = "forbidden"
