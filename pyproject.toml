[project]
name = "opsmesh"
version = "0.1.0rc7"
description = "Run AI agent teams with control, isolation, and auditability."
readme = "README.md"
requires-python = ">=3.11.8"
dependencies = [
    "opsmesh-operator[host]==0.1.0rc7",
    "alembic>=1.18.4",
    "anthropic>=1.4.0,<2.0.0",
    "boto3>=1.35.0,<2.0.0",
    "claude-agent-sdk>=0.2.152,<0.3.0",
    "cryptography>=48.0.0",
    "docker>=7.2.0,<8.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    "limits>=5.8.0,<6.0.0",
    "mcp>=1.27.1,<2.0.0",
    "openai>=2.37.0,<3.0.0",
    "openai-agents>=0.17.2",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "packaging>=26.2,<27.0",
    "pgvector>=0.5.0,<0.6.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pwdlib[argon2]>=0.3.1,<0.4.0",
    "python-json-logger>=3.3.0,<4.0.0",
    "redis>=7.4.0",
    "requests>=2.32.0,<3.0.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
packaging = ["pyinstaller==6.22.2"]
dev = [
    "boto3-stubs[s3]==1.43.23",
    "fakeredis[lua]>=2.35.1",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pyyaml>=6.0",
    "ruff>=0.12.0,<1.0.0",
    "types-docker>=7.2.0.20260827",
    "types-jsonschema>=4.26.0.20260518",
    "types-redis>=4.6.0.20241004",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["operator", "runtime"]

[tool.uv.sources]
opsmesh-operator = { workspace = true }

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["backend.tests*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "openai_smoke: opt-in tests that call the real OpenAI Agents SDK over the network",
    "team_soak: opt-in long-running team runtime soak tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/versions/*.py" = ["E501"]
"backend/app/api/routes/*.py" = ["B008"]

[tool.ruff.lint.isort]
extra-standard-library = ["operator"]

[tool.mypy]
python_version = "3.11"
platform = "linux"
mypy_path = ["operator"]
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["backend/app"]
