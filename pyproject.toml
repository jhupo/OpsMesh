[project]
name = "opsmesh"
version = "0.1.0rc23"
description = "Run AI agent teams with control, isolation, and auditability."
readme = "README.md"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "COPYING", "LICENSE-MIT", "NOTICE"]
requires-python = ">=3.11.8"
dependencies = [
    "opsmesh-operator[host]==0.1.0rc19",
    "opsmesh-plugin-sdk @ https://github.com/jhupo/opsmesh-plugin-center/releases/download/sdk/v0.5.0/opsmesh_plugin_sdk-0.5.0-py3-none-any.whl#sha256=527942f297330fe0f482722a97b06b0fa72b73bbca6c716b496a2bc5cf128858",
    "alembic>=1.18.4",
    "anthropic>=1.4.0,<2.0.0",
    "boto3>=1.35.0,<2.0.0",
    "claude-agent-sdk>=0.2.152,<0.3.0",
    "cryptography>=48.0.0",
    "docker>=7.2.0,<8.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    "limits>=5.8.0,<6.0.0",
    "mcp>=1.27.1,<2.0.0",
    "openai>=2.37.0,<3.0.0",
    "openai-agents==0.17.2",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "packaging>=26.2,<27.0",
    "pgvector>=0.5.0,<0.6.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pwdlib[argon2]>=0.3.1,<0.4.0",
    "python-json-logger>=3.3.0,<4.0.0",
    "redis>=7.4.0",
    "referencing>=0.37.0,<1.0.0",
    "requests>=2.32.0,<3.0.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "pillow>=12.3.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
packaging = ["pyinstaller==6.22.2"]
dev = [
    "aiosqlite>=0.22.1",
    "boto3-stubs[s3]==1.43.23",
    "fakeredis[lua]>=2.35.1",
    "import-linter>=2.11,<3.0",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pyyaml>=6.0",
    "ruff>=0.12.0,<1.0.0",
    "types-docker>=7.2.0.20260827",
    "types-jsonschema>=4.26.0.20260518",
    "types-redis>=4.6.0.20241004",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["operator", "runtime"]

[tool.uv.sources]
opsmesh-operator = { workspace = true }

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["backend.tests*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "openai_smoke: opt-in tests that call the real OpenAI Agents SDK over the network",
    "team_soak: opt-in long-running team runtime soak tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/versions/*.py" = ["E501"]
"backend/app/**/routes.py" = ["B008"]
"backend/app/**/*_routes.py" = ["B008"]
"backend/app/**/routes/*.py" = ["B008"]
"backend/app/**/dependencies.py" = ["B008"]
"backend/app/**/*_dependencies.py" = ["B008"]
"backend/app/**/http_common.py" = ["B008"]

[tool.ruff.lint.isort]
extra-standard-library = ["operator"]

[tool.mypy]
python_version = "3.11"
platform = "linux"
mypy_path = ["operator"]
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["backend/app"]

[tool.importlinter]
root_package = "backend"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "http-transport"
name = "HTTP middleware is composed only at the API entry point"
type = "protected"
protected_modules = [
    "backend.app.shared.http.middleware",
]
allowed_importers = [
    "backend.app.main",
]

[[tool.importlinter.contracts]]
id = "shared-no-business"
name = "Shared mechanisms cannot import business modules or bootstrap"
type = "forbidden"
source_modules = [
    "backend.app.shared",
]
forbidden_modules = [
    "backend.app.identity",
    "backend.app.workspaces",
    "backend.app.agents",
    "backend.app.teams",
    "backend.app.capabilities",
    "backend.app.resources",
    "backend.app.orchestration",
    "backend.app.runtime",
    "backend.app.platform",
    "backend.app.messaging",
    "backend.app.governance",
    "backend.app.bootstrap",
    "backend.app.main",
]

[[tool.importlinter.contracts]]
id = "pagination-no-transport"
name = "Pagination inputs have no HTTP or database dependency"
type = "forbidden"
source_modules = [
    "backend.app.shared.pagination",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
id = "production-no-test-framework"
name = "Production code cannot depend on the test framework"
type = "forbidden"
source_modules = [
    "backend.app",
]
forbidden_modules = [
    "pytest",
]

[[tool.importlinter.contracts]]
id = "docker-sdk-boundary"
name = "Docker daemon access stays in its infrastructure adapter"
type = "protected"
protected_modules = [
    "docker",
]
allowed_importers = [
    "backend.app.runtime.backends.docker",
]

[[tool.importlinter.contracts]]
id = "s3-sdk-boundary"
name = "S3 SDK access stays in its storage adapter"
type = "protected"
protected_modules = [
    "boto3",
]
allowed_importers = [
    "backend.app.resources.storage.storage",
]

[[tool.importlinter.contracts]]
id = "provider-neutral-contracts"
name = "Agent runtime contracts stay independent of vendor SDK and HTTP"
type = "forbidden"
source_modules = [
    "backend.app.agents.execution.contracts",
    "backend.app.runtime.contracts",
]
forbidden_modules = [
    "agents",
    "openai",
    "anthropic",
    "claude_agent_sdk",
    "fastapi",
    "starlette",
    "backend.app.bootstrap",
]

[[tool.importlinter.contracts]]
id = "bootstrap-composition"
name = "Only application entry points import concrete composition"
type = "protected"
protected_modules = [
    "backend.app.bootstrap",
]
allowed_importers = [
    "backend.app.main",
    "backend.app.delivery",
    "backend.app.runtime.workers.cli",
    "backend.app.platform.updates.daemon",
]

[[tool.importlinter.contracts]]
id = "worker-dispatch-boundary"
name = "Worker loop accepts injected business handlers and maintenance"
type = "forbidden"
source_modules = [
    "backend.app.runtime.workers.runner",
    "backend.app.runtime.workers.reporting",
    "backend.app.runtime.workers.contracts",
]
forbidden_modules = [
    "backend.app.agents",
    "backend.app.teams",
    "backend.app.capabilities",
    "backend.app.resources",
    "backend.app.orchestration",
    "backend.app.platform",
    "backend.app.messaging",
    "backend.app.bootstrap",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "email-http-composition"
name = "Email HTTP routes are only composed by the platform API"
type = "protected"
protected_modules = [
    "backend.app.messaging.email.routes",
]
allowed_importers = [
    "backend.app.bootstrap.platform_routes",
]

[[tool.importlinter.contracts]]
id = "email-service-boundary"
name = "Email persistence and delivery stay independent of HTTP and consumers"
type = "forbidden"
source_modules = [
    "backend.app.messaging.email.service",
    "backend.app.messaging.email.schemas",
    "backend.app.messaging.email.models",
    "backend.app.messaging.email.smtp",
]
forbidden_modules = [
    "backend.app.bootstrap",
    "backend.app.runtime",
    "backend.app.identity",
    "backend.app.workspaces",
    "backend.app.orchestration",
    "fastapi",
    "starlette",
]

[[tool.importlinter.contracts]]
id = "email-model-owner"
name = "Email persistence is private to its service and registration"
type = "protected"
protected_modules = [
    "backend.app.messaging.email.models",
]
allowed_importers = [
    "backend.app.messaging.email.service",
    "backend.app.bootstrap.models",
]
