[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmesh"
version = "0.5.0"
description = "Embedded event framework for plugin-based agent applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
requires-python = ">=3.11"
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
opsmesh = "opsmesh.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["opsmesh*"]

[tool.setuptools.package-data]
"opsmesh" = ["py.typed", "**/*.pyi"]

[project.urls]
Repository = "https://github.com/jhupo/OpsMesh"
Issues = "https://github.com/jhupo/OpsMesh/issues"
Documentation = "https://github.com/jhupo/OpsMesh/tree/master/docs"
