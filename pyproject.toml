[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opsmesh"
version = "0.2.0"
description = "A plugin application host for agents and messaging channels"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "plugins", "openai", "automation", "messaging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "opsmesh-sdk==0.2.0", "openai-agents==0.22.3", "openai==3.28.0",
  "fastapi>=0.136,<0.137", "uvicorn>=0.34,<1", "sqlalchemy==2.0.49",
  "psycopg[binary]>=3.3,<4", "alembic>=1.18,<2", "pydantic-settings>=2.12,<3",
  "cryptography>=50.0.2,<51", "httpx>=0.28,<0.29", "PyYAML>=6,<7",
  "croniter>=6,<7", "python-multipart>=0.0.20", "websockets>=15,<17",
  "nonebot-adapter-qq @ git+https://github.com/jhupo/OpsMesh.git@e79e4a0830b55107752e706b2807d6651d29d463", "nonebot2[fastapi,httpx,websockets]==2.5.0",
  "dingtalk-stream==0.24.4b1",
  "psutil>=7.2,<8",
]

[project.optional-dependencies]
dev = ["ruff==0.15.13", "mypy==1.20.2", "types-PyYAML", "types-croniter", "import-linter>=2,<3"]
sandbox = ["openai-agents[docker]==0.22.3"]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
opsmesh = "opsmesh.bootstrap.cli:entrypoint"
opsmesh-worker = "opsmesh.bootstrap.worker:main"

[project.urls]
Homepage = "https://github.com/jhupo/OpsMesh"
Documentation = "https://github.com/jhupo/OpsMesh/tree/master/docs"
Repository = "https://github.com/jhupo/OpsMesh"
Issues = "https://github.com/jhupo/OpsMesh/issues"
Changelog = "https://github.com/jhupo/OpsMesh/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/opsmesh"]

[tool.hatch.metadata]
# The fixed QQ source changes only its cryptography upper bound; see docs/gateway.md.
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["src/opsmesh", "sdk/python/src", "sdk/python/pyproject.toml", "sdk/python/README.md", "sdk/python/LICENSE", "sdk/python/AGENTS.md", "sdk/python/CONTRIBUTING.md", "sdk/python/SECURITY.md", "sdk/python/CHANGELOG.md", "sdk/python/.gitattributes", "sdk/python/examples", "sdk/python/.github", "sdk/python/.gitignore", "examples", "deploy", "scripts/build_release.py", "scripts/audit_requirements.py", "scripts/release_assets.py", "scripts/server_entry.py", ".github", ".agents", ".env.example", ".dockerignore", ".gitattributes", "README.md", "AGENTS.md", "CONTRIBUTING.md", "SECURITY.md", "CHANGELOG.md", "LICENSE", "docs", "pyproject.toml", "uv.lock"]

[tool.uv.sources]
opsmesh-sdk = { path = "sdk/python", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
platform = "linux"
files = ["src", "sdk/python/src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["opsmesh", "opsmesh_sdk"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Plugin SDK is independent of the host"
type = "forbidden"
source_modules = ["opsmesh_sdk"]
forbidden_modules = ["opsmesh"]

[[tool.importlinter.contracts]]
name = "Business modules do not import process bootstrap"
type = "forbidden"
source_modules = ["opsmesh.agents", "opsmesh.catalog", "opsmesh.gateway", "opsmesh.plugins", "opsmesh.quotas", "opsmesh.resources", "opsmesh.sessions", "opsmesh.tasks", "opsmesh.users", "opsmesh.shared", "opsmesh.infra"]
forbidden_modules = ["opsmesh.bootstrap"]

[[tool.importlinter.contracts]]
name = "The host has no Temporal runtime dependency"
type = "forbidden"
source_modules = ["opsmesh"]
forbidden_modules = ["temporalio"]

[[tool.importlinter.contracts]]
name = "Database infrastructure does not assemble business models"
type = "forbidden"
source_modules = ["opsmesh.infra"]
forbidden_modules = ["opsmesh.agents", "opsmesh.catalog", "opsmesh.gateway", "opsmesh.plugins", "opsmesh.quotas", "opsmesh.resources", "opsmesh.sessions", "opsmesh.tasks", "opsmesh.users"]

[[tool.importlinter.contracts]]
name = "Task management does not depend on execution runtime"
type = "forbidden"
source_modules = ["opsmesh.tasks.models", "opsmesh.tasks.schemas", "opsmesh.tasks.service", "opsmesh.tasks.interactions", "opsmesh.tasks.schedules", "opsmesh.tasks.scheduler"]
forbidden_modules = ["opsmesh.tasks.runtime"]

[[tool.importlinter.contracts]]
name = "Runtime code does not import HTTP routes"
type = "forbidden"
source_modules = ["opsmesh.tasks.runtime", "opsmesh.gateway.worker", "opsmesh.gateway.delivery", "opsmesh.sessions.runtime", "opsmesh.sessions.sandboxes", "opsmesh.resources.runtime"]
forbidden_modules = ["opsmesh.agents.routes", "opsmesh.catalog.routes", "opsmesh.gateway.routes", "opsmesh.plugins.routes", "opsmesh.quotas.routes", "opsmesh.resources.routes", "opsmesh.sessions.routes", "opsmesh.tasks.routes", "opsmesh.users.routes", "opsmesh.shared.http"]

