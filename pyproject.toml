[project]
name = "opsmesh"
version = "0.1.0"
description = "Run AI agent teams with control, isolation, and auditability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "boto3>=1.35.0,<2.0.0",
    "cryptography>=48.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "mcp>=1.27.1,<2.0.0",
    "openai-agents>=0.17.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-json-logger>=3.3.0,<4.0.0",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "fakeredis>=2.35.1",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
    "types-redis>=4.6.0.20241004",
]

[tool.uv]
package = false

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "openai_smoke: opt-in tests that call the real OpenAI Agents SDK over the network",
    "team_soak: opt-in long-running team runtime soak tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/versions/*.py" = ["E501"]
"backend/app/api/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["backend/app"]
