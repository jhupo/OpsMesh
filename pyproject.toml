type = "forbidden"
source_modules = ["opsmesh.workspaces.credentials"]
forbidden_modules = [
    "opsmesh.workspaces.projects",
    "opsmesh.workspaces.capacity",
    "opsmesh.workspaces.model_providers",
    "opsmesh.workspaces.notifications",
]

[[tool.importlinter.contracts]]
id = "v4-workspaces-capacity-isolated"
name = "Capacity stays on membership access and shared database mechanisms"
type = "forbidden"
source_modules = ["opsmesh.workspaces.capacity"]
forbidden_modules = [
    "opsmesh.workspaces.projects",
    "opsmesh.workspaces.credentials",
    "opsmesh.workspaces.model_providers",
