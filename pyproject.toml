[project]
name = "opsmesh"
version = "0.1.1"
description = "Run AI agent teams with control, isolation, and auditability."
readme = "README.md"
license = "LGPL-3.0-only"
license-files = [
    "LICENSE", "COPYING", "LICENSE-MIT", "NOTICE",
    "src/opsmesh/gateway/adapters/UPSTREAM-LICENSE",
]
requires-python = ">=3.12"
dependencies = [
    "opsmesh-sdk==0.1.1",
    "alembic>=1.18.4",
    "cryptography>=50.0.0",
    "docker>=7.2.0,<8.0.0",
    "email-validator>=2.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "filelock>=3.20.0,<4.0.0",
    "httpx>=0.28.0,<1.0.0",
    "httpx2>=2.12.0,<3.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    "limits>=5.8.0,<6.0.0",
    "mcp>=2.0.0,<3.0.0",
    "openai>=3.0.0,<4.0.0",
    "openai-agents>=0.22.0,<0.23.0",
    # Native QQ and DingTalk transports.
    "pydantic>=2.10.0,<3.0.0",
    "aiohttp>=3.9",
    "dingtalk-stream>=0.24.3",
    "websockets>=12.0",
    "temporalio[opentelemetry,pydantic]>=1.33.0,<2.0.0",
    "temporalio-openai-agents[mcp,openinference]==1.1.0",
    "typesafe-sdk==0.7.5",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "packaging>=26.2,<27.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "pyyaml>=6.0,<7.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "pwdlib[argon2]>=0.3.1,<0.4.0",
    "python-json-logger>=3.3.0,<4.0.0",
    "redis>=7.4.0",
    "referencing>=0.37.0,<1.0.0",
    "requests>=2.32.0,<3.0.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "pillow>=13.0.0",
]

[project.scripts]
opsmesh-server = "opsmesh.bootstrap.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
compute = ["mcp>=2.0.0,<3.0.0"]
packaging = ["pyinstaller==6.22.2"]
dev = [
    "opsmesh-operator[host]==0.1.1",
    "aiosqlite>=0.22.1",
    "fakeredis[lua]>=2.35.1",
    "import-linter>=2.11,<3.0",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.12.0,<1.0.0",
    "types-pyyaml>=6.0.12",
    "types-docker>=7.2.0.20260827",
    "types-jsonschema>=4.26.0.20260518",
    "types-redis>=4.6.0.20241004",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["deploy/cli", "sdk/python"]

[tool.uv.sources]
opsmesh-sdk = { workspace = true }
opsmesh-operator = { workspace = true }

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["opsmesh*"]

[tool.setuptools.package-data]
"opsmesh.gateway.adapters" = ["UPSTREAM-LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "native_sandbox: opt-in product tests requiring a Linux Docker daemon and PostgreSQL",
    "openai_smoke: opt-in tests that call the real OpenAI Agents SDK over the network",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backup", "backup_2"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"src/opsmesh/**/routes.py" = ["B008"]
"src/opsmesh/**/*_routes.py" = ["B008"]
"src/opsmesh/**/routes/*.py" = ["B008"]
"src/opsmesh/**/dependencies.py" = ["B008"]
"src/opsmesh/**/*_dependencies.py" = ["B008"]
"src/opsmesh/**/http_common.py" = ["B008"]

[tool.ruff.lint.isort]
extra-standard-library = ["operator"]

[tool.mypy]
python_version = "3.12"
platform = "linux"
mypy_path = ["src", "deploy/cli", "sdk/python/src"]
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src/opsmesh", "sdk/python/src/opsmesh_sdk"]

[[tool.mypy.overrides]]
module = ["dingtalk_stream"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "opsmesh"
include_external_packages = true

# Enforce infrastructure and execution boundaries for the current feature tree.
# Ordinary feature calls use public functions; audit_app_layout checks module cycles.

[[tool.importlinter.contracts]]
id = "shared-foundation"
name = "Shared utilities do not depend on application code or execution SDKs"
type = "forbidden"
source_modules = ["opsmesh.shared"]
forbidden_modules = [
    "opsmesh.telemetry", "opsmesh.temporal", "opsmesh.config",
    "opsmesh.users", "opsmesh.resources",
    "opsmesh.platform", "opsmesh.agents", "opsmesh.workflows",
    "opsmesh.execution",
    "opsmesh.gateway",
    "opsmesh.plugins",
    "opsmesh.bootstrap",
    "temporalio", "agents", "openai", "opentelemetry",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "infrastructure-no-business"
name = "Infrastructure and configuration do not depend on business features"
type = "forbidden"
source_modules = ["opsmesh.telemetry", "opsmesh.temporal", "opsmesh.config"]
forbidden_modules = [
    "opsmesh.users", "opsmesh.resources",
    "opsmesh.platform", "opsmesh.agents", "opsmesh.workflows",
    "opsmesh.execution",
    "opsmesh.gateway",
    "opsmesh.bootstrap",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "features-no-bootstrap"
name = "Business features do not import process startup and assembly"
type = "forbidden"
source_modules = [
    "opsmesh.users", "opsmesh.resources",
    "opsmesh.platform", "opsmesh.agents", "opsmesh.workflows",
    "opsmesh.execution",
    "opsmesh.gateway",
]
forbidden_modules = ["opsmesh.bootstrap"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "gateway-no-agent-or-execution-business"
name = "Gateway transports receive execution callbacks from bootstrap"
type = "forbidden"
source_modules = ["opsmesh.gateway"]
forbidden_modules = [
    "opsmesh.agents", "opsmesh.execution", "opsmesh.workflows", "opsmesh.platform",
    "opsmesh.resources.directories",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "plugin-host-no-feature-runtime"
name = "The generic plugin host receives feature adapters through bootstrap"
type = "forbidden"
source_modules = ["opsmesh.plugins"]
forbidden_modules = [
    "opsmesh.agents", "opsmesh.gateway", "opsmesh.execution", "opsmesh.workflows",
    "opsmesh.resources.directories", "opsmesh.bootstrap", "agents", "temporalio",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "storage-no-business"
name = "Storage mechanisms and layout do not depend on feature authorization or runtimes"
type = "forbidden"
source_modules = ["opsmesh.resources.storage", "opsmesh.resources.layout"]
forbidden_modules = [
    "opsmesh.resources.directories", "opsmesh.users", "opsmesh.agents",
    "opsmesh.execution", "opsmesh.workflows", "opsmesh.gateway", "opsmesh.plugins",
    "opsmesh.platform", "opsmesh.bootstrap", "opsmesh.config",
    "sqlalchemy", "agents", "temporalio", "fastapi",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "execution-no-orchestration"
name = "Execution receives orchestration adapters through bootstrap"
type = "forbidden"
source_modules = ["opsmesh.execution"]
forbidden_modules = ["opsmesh.workflows", "opsmesh.temporal", "temporalio"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "agent-adapter-no-orm"
name = "The official Agent adapter does not own persistence or HTTP routes"
type = "forbidden"
source_modules = [
    "opsmesh.agents.assembly", "opsmesh.execution.runner", "opsmesh.execution.tools",
    "opsmesh.execution.sessions.storage",
]
forbidden_modules = ["sqlalchemy", "fastapi"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "workflow-inputs-no-io"
name = "Definition values and execution inputs stay independent of I/O frameworks"
type = "forbidden"
source_modules = [
    "opsmesh.agents.config", "opsmesh.workflows.contracts", "opsmesh.execution.contracts",
]
forbidden_modules = ["sqlalchemy", "fastapi", "temporalio"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "workflow-graph-no-engine"
name = "Workflow graph execution uses injected ports without engine or database imports"
type = "forbidden"
source_modules = [
    "opsmesh.workflows.runner", "opsmesh.workflows.context", "opsmesh.workflows.compiler",
    "opsmesh.workflows.nodes", "opsmesh.workflows.graph", "opsmesh.workflows.values",
    "opsmesh.workflows.conditions", "opsmesh.workflows.mappings",
]
forbidden_modules = ["opsmesh.workflows.engines", "temporalio", "sqlalchemy", "fastapi"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "production-no-tests-or-backups"
name = "Production code does not import test or historical implementations"
type = "forbidden"
source_modules = ["opsmesh"]
forbidden_modules = ["pytest", "backup", "backup_2"]
allow_indirect_imports = true

