[project]
name = "opsmesh"
version = "0.1.0rc23"
description = "Run AI agent teams with control, isolation, and auditability."
readme = "README.md"
license = "LGPL-3.0-only"
license-files = ["LICENSE", "COPYING", "LICENSE-MIT", "NOTICE"]
requires-python = ">=3.11.8"
dependencies = [
    "opsmesh-operator[host]==0.1.0rc23",
    "alembic>=1.18.4",
    "cryptography>=48.0.0",
    "docker>=7.2.0,<8.0.0",
    "email-validator>=2.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "httpx2>=2.12.0,<3.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    "limits>=5.8.0,<6.0.0",
    "mcp>=2.0.0,<3.0.0",
    "openai>=3.0.0,<4.0.0",
    "openai-agents>=0.22.0,<0.23.0",
    "temporalio[opentelemetry,pydantic]>=1.33.0,<2.0.0",
    "temporalio-openai-agents[mcp,openinference]==1.1.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "packaging>=26.2,<27.0",
    "pgvector>=0.5.0,<0.6.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "pyyaml>=6.0,<7.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pwdlib[argon2]>=0.3.1,<0.4.0",
    "python-json-logger>=3.3.0,<4.0.0",
    "redis>=7.4.0",
    "referencing>=0.37.0,<1.0.0",
    "requests>=2.32.0,<3.0.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "pillow>=12.3.0",
]

[project.scripts]
opsmesh-cli = "opsmesh.bootstrap.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
compute = ["mcp>=2.0.0,<3.0.0"]
packaging = ["pyinstaller==6.22.2"]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis[lua]>=2.35.1",
    "import-linter>=2.11,<3.0",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
    "types-pyyaml>=6.0.12",
    "types-docker>=7.2.0.20260827",
    "types-jsonschema>=4.26.0.20260518",
    "types-redis>=4.6.0.20241004",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["operator", "sdk/python"]

[tool.uv.sources]
opsmesh-operator = { workspace = true }

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["opsmesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "native_sandbox: opt-in product tests requiring a Linux Docker daemon and PostgreSQL",
    "openai_smoke: opt-in tests that call the real OpenAI Agents SDK over the network",
    "team_soak: opt-in long-running team runtime soak tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backup", "backup_2"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"src/opsmesh/**/routes.py" = ["B008"]
"src/opsmesh/**/*_routes.py" = ["B008"]
"src/opsmesh/**/routes/*.py" = ["B008"]
"src/opsmesh/**/dependencies.py" = ["B008"]
"src/opsmesh/**/*_dependencies.py" = ["B008"]
"src/opsmesh/**/http_common.py" = ["B008"]

[tool.ruff.lint.isort]
extra-standard-library = ["operator"]

[tool.mypy]
python_version = "3.11"
platform = "linux"
mypy_path = ["src", "operator", "sdk/python/src"]
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src/opsmesh", "sdk/python/src/opsmesh_sdk"]

[tool.importlinter]
root_package = "opsmesh"
include_external_packages = true

# V4 contracts (docs/source-refactor-plan-v4.md section 12). Each step extends
# this section for the modules it implements; the root and second-level graphs
# must stay acyclic and shared must keep zero product dependencies.

[[tool.importlinter.contracts]]
id = "v4-root-independence"
name = "Shared has zero product module dependencies"
type = "forbidden"
source_modules = ["opsmesh.shared"]
forbidden_modules = [
    "opsmesh.telemetry", "opsmesh.temporal", "opsmesh.bootstrap",
    "opsmesh.config", "opsmesh.main",
]

[[tool.importlinter.contracts]]
id = "v4-telemetry-foundation"
name = "Telemetry uses only shared mechanisms and observability SDKs"
type = "forbidden"
source_modules = ["opsmesh.telemetry"]
forbidden_modules = ["opsmesh.temporal", "opsmesh.bootstrap", "opsmesh.config", "opsmesh.main"]

[[tool.importlinter.contracts]]
id = "v4-temporal-foundation"
name = "Temporal uses shared and telemetry only; no business modules"
type = "forbidden"
source_modules = ["opsmesh.temporal"]
forbidden_modules = [
    "opsmesh.bootstrap", "opsmesh.config", "opsmesh.main",
    "opsmesh.identity", "opsmesh.capabilities", "opsmesh.resources",
    "opsmesh.governance", "opsmesh.extensions", "opsmesh.execution",
    "opsmesh.workspaces", "opsmesh.orchestration", "opsmesh.channels",
    "opsmesh.platform",
]

[[tool.importlinter.contracts]]
id = "v4-config-foundation"
name = "Process configuration depends on shared mechanisms only"
type = "forbidden"
source_modules = ["opsmesh.config"]
forbidden_modules = [
    "opsmesh.telemetry", "opsmesh.temporal", "opsmesh.bootstrap",
    "opsmesh.main", "opsmesh.shared.http",
]

[[tool.importlinter.contracts]]
id = "v4-shared-core-independent"
name = "Core types and pure helpers cannot depend on infrastructure adapters"
type = "forbidden"
source_modules = [
    "opsmesh.shared.contracts", "opsmesh.shared.errors", "opsmesh.shared.files",
    "opsmesh.shared.pagination", "opsmesh.shared.serialization",
    "opsmesh.shared.version", "opsmesh.shared.mail",
]
forbidden_modules = [
    "opsmesh.shared.db", "opsmesh.shared.redis",
    "opsmesh.shared.http", "opsmesh.shared.security",
]

[[tool.importlinter.contracts]]
id = "v4-pagination-no-transport"
name = "Pagination inputs have no HTTP or database dependency"
type = "forbidden"
source_modules = ["opsmesh.shared.pagination"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy"]

[[tool.importlinter.contracts]]
id = "v4-shared-infrastructure-no-http"
name = "Database and Redis mechanisms have no HTTP framework dependency"
type = "forbidden"
source_modules = ["opsmesh.shared.db", "opsmesh.shared.redis", "opsmesh.shared.security"]
forbidden_modules = ["fastapi", "starlette", "opsmesh.shared.http"]

[[tool.importlinter.contracts]]
id = "v4-shared-no-execution-sdk"
name = "Shared does not own execution or telemetry SDK integration"
type = "forbidden"
source_modules = ["opsmesh.shared"]
forbidden_modules = ["temporalio", "agents", "openai", "opentelemetry"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "v4-bootstrap-not-imported"
name = "Bootstrap is never imported by other application modules"
type = "forbidden"
source_modules = [
    "opsmesh.shared", "opsmesh.telemetry", "opsmesh.temporal", "opsmesh.config",
]
forbidden_modules = ["opsmesh.bootstrap"]

[[tool.importlinter.contracts]]
id = "v4-identity-boundaries"
name = "Identity uses shared, telemetry, temporal and governance only"
type = "forbidden"
source_modules = ["opsmesh.identity"]
forbidden_modules = [
    "opsmesh.platform", "opsmesh.resources", "opsmesh.capabilities",
    "opsmesh.extensions", "opsmesh.execution", "opsmesh.workspaces",
    "opsmesh.orchestration", "opsmesh.channels", "opsmesh.bootstrap",
    "opsmesh.config", "opsmesh_sdk",
]

[[tool.importlinter.contracts]]
id = "v4-governance-boundaries"
name = "Governance never imports identity or later owners; identity is injected"
type = "forbidden"
source_modules = ["opsmesh.governance"]
forbidden_modules = [
    "opsmesh.identity", "opsmesh.platform", "opsmesh.capabilities",
    "opsmesh.resources", "opsmesh.extensions", "opsmesh.execution",
    "opsmesh.workspaces", "opsmesh.orchestration", "opsmesh.channels",
    "opsmesh.bootstrap", "opsmesh.config", "opsmesh_sdk",
]

[[tool.importlinter.contracts]]
id = "v4-governance-costs-boundaries"
name = "Costs uses audit and shared only; no other owner ledgers"
type = "forbidden"
source_modules = ["opsmesh.governance.costs"]
forbidden_modules = [
    "opsmesh.identity", "opsmesh.platform", "opsmesh.capabilities",
    "opsmesh.resources", "opsmesh.extensions", "opsmesh.execution",
    "opsmesh.workspaces", "opsmesh.orchestration", "opsmesh.channels",
    "opsmesh.bootstrap", "opsmesh.config", "opsmesh_sdk",
]

[[tool.importlinter.contracts]]
id = "v4-platform-boundaries"
name = "Platform uses shared, telemetry, temporal, identity and governance only"
type = "forbidden"
source_modules = ["opsmesh.platform"]
forbidden_modules = [
    "opsmesh.capabilities", "opsmesh.resources", "opsmesh.extensions",
    "opsmesh.execution", "opsmesh.workspaces", "opsmesh.orchestration",
    "opsmesh.channels", "opsmesh.bootstrap", "opsmesh_sdk",
]

[[tool.importlinter.contracts]]
id = "v4-capabilities-boundaries"
name = "Capabilities use shared, identity and governance only"
type = "forbidden"
source_modules = ["opsmesh.capabilities"]
forbidden_modules = [
    "opsmesh.platform", "opsmesh.resources", "opsmesh.extensions",
    "opsmesh.execution", "opsmesh.workspaces", "opsmesh.orchestration",
    "opsmesh.channels", "opsmesh.bootstrap", "opsmesh.config", "opsmesh.main",
]

[[tool.importlinter.contracts]]
id = "v4-resources-boundaries"
name = "Resources use shared, telemetry, temporal and governance only"
type = "forbidden"
source_modules = ["opsmesh.resources"]
forbidden_modules = [
    "opsmesh.identity", "opsmesh.capabilities", "opsmesh.platform",
    "opsmesh.extensions", "opsmesh.execution", "opsmesh.workspaces",
    "opsmesh.orchestration", "opsmesh.channels", "opsmesh.bootstrap",
    "opsmesh.config", "opsmesh.main", "opsmesh_sdk",
]

[[tool.importlinter.contracts]]
id = "v4-workspaces-boundaries"
name = "Workspaces use shared, temporal, identity, capabilities, resources, extensions, execution and governance only"
type = "forbidden"
source_modules = ["opsmesh.workspaces"]
forbidden_modules = [
    "opsmesh.platform", "opsmesh.orchestration", "opsmesh.channels",
    "opsmesh.bootstrap", "opsmesh.config", "opsmesh.main", "opsmesh_sdk",
]

[[tool.importlinter.contracts]]
id = "v4-workspaces-members-isolated"
name = "Space membership never reaches project or sibling workspace modules"
type = "forbidden"
source_modules = ["opsmesh.workspaces.members"]
forbidden_modules = [
