[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmesh-cli"
version = "0.6.0"
description = "Local Linux plugin management service for OpsMesh"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["opsmesh==0.6.0", "packaging>=23"]

[project.scripts]
opsmesh = "opsmesh_cli.main:main"

[tool.setuptools]
packages = ["opsmesh_cli", "opsmesh_cli.plugin", "opsmesh_cli.storage"]
package-dir = {opsmesh_cli = "src"}
