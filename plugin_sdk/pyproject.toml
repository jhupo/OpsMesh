[project]
name = "opsmesh-plugin-sdk"
version = "0.1.0"
description = "Provider-neutral contracts for external OpsMesh connectors and plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
signing = ["cryptography>=48"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opsmesh_plugin_sdk*"]
