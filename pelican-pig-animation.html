<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑猪 · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: dark;
      --sky: #12233f;
      --water: #143d5a;
      --sun: #ffd166;
      --pink: #f68cae;
      --pink-dark: #d85f84;
      --cream: #fff1cf;
      --ink: #202b45;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 10%, #27476e 0%, var(--sky) 55%, #0c1428 100%);
      font-family: system-ui, sans-serif;
    }

    .scene {
      width: min(100vw, 960px);
      aspect-ratio: 16 / 10;
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      box-shadow: 0 24px 70px #050b18aa, inset 0 0 0 1px #ffffff22;
      background: var(--water);
    }

    svg { width: 100%; height: 100%; display: block; }

    .sun { animation: sunPulse 4s ease-in-out infinite; transform-origin: 76% 22%; }
    .cloud { animation: drift 18s linear infinite; }
    .cloud.slow { animation-duration: 26s; animation-delay: -9s; }
    .water-line { animation: ripple 3s ease-in-out infinite; transform-origin: center; }
    .water-line:nth-child(2n) { animation-delay: -1.4s; animation-duration: 4.5s; }

    .rider { animation: ride 2.4s ease-in-out infinite; transform-origin: 50% 78%; }
    .pelican-body { animation: pelicanBob 2.4s ease-in-out infinite; transform-origin: 52% 65%; }
    .pelican-wing { animation: wing 1.2s ease-in-out infinite; transform-origin: 48% 58%; }
    .beak { animation: beakTalk 3.2s ease-in-out infinite; transform-origin: 82% 45%; }
    .pig { animation: pigBounce 2.4s ease-in-out infinite; transform-origin: 50% 78%; }
    .pig-ear { animation: earWiggle 2.4s ease-in-out infinite; transform-origin: center bottom; }
    .tail { animation: tailWag 1.1s ease-in-out infinite; transform-origin: 85% 70%; }
    .dust { animation: dustPuff 2.4s ease-in-out infinite; transform-origin: center; }

    @keyframes ride {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes pigBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }
    @keyframes pelicanBob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }
    @keyframes wing {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-13deg); }
    }
    @keyframes beakTalk {
      0%, 72%, 100% { transform: rotate(0deg); }
      76%, 84% { transform: rotate(4deg); }
      80% { transform: rotate(-2deg); }
    }
    @keyframes earWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(-7deg); }
      50% { transform: rotate(16deg); }
    }
    @keyframes drift {
      from { transform: translateX(-180px); }
      to { transform: translateX(1100px); }
    }
    @keyframes ripple {
      0%, 100% { opacity: .35; transform: scaleX(.8); }
      50% { opacity: .9; transform: scaleX(1.15); }
    }
    @keyframes sunPulse {
      0%, 100% { transform: scale(1); opacity: .9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes dustPuff {
      0%, 100% { opacity: 0; transform: scale(.5) translateX(0); }
      45% { opacity: .55; transform: scale(1) translateX(-18px); }
      70% { opacity: 0; transform: scale(1.25) translateX(-35px); }
    }

    .caption {
      position: absolute;
      left: 24px;
      bottom: 18px;
      padding: 8px 13px;
      border-radius: 999px;
      color: #fff6dc;
      background: #071226aa;
      font-size: clamp(11px, 1.5vw, 15px);
      letter-spacing: .08em;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="鹈鹕骑着粉色小猪在水边前进的二维动画">
    <svg viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
      <title id="title">鹈鹕骑猪动画</title>
      <desc id="desc">一只鹈鹕骑着粉色小猪，沿着湖边轻快地前进。</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#294f79"/>
          <stop offset="1" stop-color="#8cc7cf"/>
        </linearGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4eaf83"/>
          <stop offset="1" stop-color="#1e604f"/>
        </linearGradient>
        <filter id="softGlow"><feGaussianBlur stdDeviation="8"/></filter>
      </defs>

      <rect width="960" height="600" fill="url(#sky)"/>
      <circle class="sun" cx="730" cy="128" r="68" fill="#ffd166" opacity=".2" filter="url(#softGlow)"/>
      <circle class="sun" cx="730" cy="128" r="48" fill="var(--sun)"/>

      <g class="cloud" fill="#ffffff" opacity=".55">
        <ellipse cx="120" cy="132" rx="75" ry="24"/>
        <ellipse cx="76" cy="123" rx="35" ry="29"/>
        <ellipse cx="157" cy="116" rx="42" ry="34"/>
      </g>
      <g class="cloud slow" fill="#ffffff" opacity=".32">
        <ellipse cx="380" cy="206" rx="92" ry="24"/>
        <ellipse cx="328" cy="195" rx="40" ry="31"/>
        <ellipse cx="432" cy="190" rx="50" ry="39"/>
      </g>

      <path d="M0 350 Q145 300 290 352 T580 340 T960 350 V600 H0Z" fill="#276e6b" opacity=".65"/>
      <path d="M0 390 Q180 355 350 395 T690 385 T960 402 V600 H0Z" fill="url(#ground)"/>
      <path d="M0 440 Q170 420 310 445 T630 438 T960 450 V600 H0Z" fill="#174f46" opacity=".65"/>

      <g class="water-line" fill="none" stroke="#a9e4d2" stroke-width="4" stroke-linecap="round" opacity=".5">
        <path d="M50 488 C130 470 200 470 280 488"/><path d="M680 500 C770 480 850 482 930 500"/>
        <path d="M80 545 C160 527 230 528 315 545"/><path d="M580 560 C680 540 780 542 880 560"/>
      </g>

      <g class="dust" fill="#f8d7a0">
        <circle cx="254" cy="482" r="13"/><circle cx="222" cy="493" r="8"/><circle cx="286" cy="497" r="7"/>
      </g>

      <g class="rider">
        <!-- pig -->
        <g class="pig">
          <ellipse cx="486" cy="438" rx="170" ry="83" fill="#d85f84" opacity=".32"/>
          <ellipse cx="486" cy="421" rx="154" ry="77" fill="var(--pink)" stroke="var(--ink)" stroke-width="8"/>
          <ellipse cx="604" cy="409" rx="72" ry="62" fill="#f49ab5" stroke="var(--ink)" stroke-width="8"/>
          <path class="pig-ear" d="M580 363 Q571 314 610 340 Q631 354 617 381Z" fill="#f49ab5" stroke="var(--ink)" stroke-width="8"/>
          <path class="pig-ear" d="M646 359 Q682 321 685 366 Q684 389 656 388Z" fill="#f49ab5" stroke="var(--ink)" stroke-width="8"/>
          <ellipse cx="632" cy="428" rx="35" ry="24" fill="#ffb2c6" stroke="var(--ink)" stroke-width="7"/>
          <circle cx="620" cy="426" r="5" fill="var(--ink)"/><circle cx="644" cy="426" r="5" fill="var(--ink)"/>
          <circle cx="579" cy="399" r="8" fill="var(--ink)"/><circle cx="647" cy="397" r="8" fill="var(--ink)"/>
          <path d="M575 470 Q590 455 606 470" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
          <path d="M374 474 L366 529 Q365 549 390 549 L414 549 L420 478Z" fill="#e77798" stroke="var(--ink)" stroke-width="8"/>
          <path d="M525 478 L523 536 Q526 553 548 553 L574 553 L577 465Z" fill="#e77798" stroke="var(--ink)" stroke-width="8"/>
          <path class="tail" d="M340 391 Q286 349 307 315 Q327 286 343 321 Q356 345 337 363" fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round"/>
          <path d="M430 407 Q470 388 520 407" fill="none" stroke="#e77798" stroke-width="11" stroke-linecap="round" opacity=".7"/>
        </g>

        <!-- pelican -->
        <g class="pelican-body">
          <ellipse cx="474" cy="280" rx="86" ry="116" fill="var(--cream)" stroke="var(--ink)" stroke-width="8" transform="rotate(-9 474 280)"/>
          <path class="pelican-wing" d="M432 236 Q355 278 393 372 Q415 395 448 348 Q470 306 469 257Z" fill="#f6dcae" stroke="var(--ink)" stroke-width="8"/>
          <path d="M492 176 Q529 133 566 170 Q585 195 556 222 L526 250 L487 222Z" fill="#fff8df" stroke="var(--ink)" stroke-width="8"/>
          <circle cx="537" cy="184" r="9" fill="var(--ink)"/>
          <g class="beak">
            <path d="M554 203 Q673 198 709 248 Q660 274 546 238Z" fill="#f5a04e" stroke="var(--ink)" stroke-width="8"/>
            <path d="M559 234 Q634 259 699 248 Q665 311 572 271Z" fill="#e87954" stroke="var(--ink)" stroke-width="8"/>
            <path d="M575 237 Q632 250 683 249" fill="none" stroke="#bd5c4b" stroke-width="5"/>
          </g>
          <path d="M459 372 Q472 401 494 418" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
          <path d="M492 372 Q510 399 526 415" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/>
          <path d="M444 418 Q472 411 501 422" fill="none" stroke="#f5a04e" stroke-width="10" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
    <div class="caption">湖边出发 · 鹈鹕和小猪的下午散步</div>
  </main>
</body>
</html>
