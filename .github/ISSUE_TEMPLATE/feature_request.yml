name: Feature Request
description: Suggest an improvement for OpsMesh.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the behavior, API, or workflow you want.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety And Isolation Notes
      description: Any workspace, credential, runtime, approval, or audit impact?

