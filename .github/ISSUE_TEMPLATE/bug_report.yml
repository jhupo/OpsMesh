name: Bug report
description: Report a reproducible problem in implemented functionality.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Include minimal steps, version and platform. Remove credentials and private data.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant output
    validations:
      required: true
