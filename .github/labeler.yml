'area:backend':
  - changed-files:
      - any-glob-to-any-file: ['src/**', 'tests/**', 'migrations/**']
'area:runtime':
  - changed-files:
      - any-glob-to-any-file: ['src/opsmesh/runtime/**', 'runtime/**', 'operator/**']
'area:security':
  - changed-files:
      - any-glob-to-any-file: ['src/opsmesh/identity/**', 'src/opsmesh/shared/security/**', 'SECURITY.md', '.github/workflows/codeql.yml', '.github/workflows/dependency-review.yml']
'area:delivery':
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'deploy/**', 'scripts/**']
documentation:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '*.md']
dependencies:
  - changed-files:
      - any-glob-to-any-file: ['**/pyproject.toml', '**/uv.lock', '**/requirements*.txt', '.github/dependabot.yml']
