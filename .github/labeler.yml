'area:backend':
  - changed-files:
      - any-glob-to-any-file: ['src/**', 'tests/**', 'migrations/**', 'sdk/**']
'area:runtime':
  - changed-files:
      - any-glob-to-any-file: ['src/opsmesh/execution/runtime/**', 'deploy/cli/**']
'area:security':
  - changed-files:
      - any-glob-to-any-file: ['src/opsmesh/users/**', 'src/opsmesh/agents/providers/**', 'src/opsmesh/plugins/**', 'src/opsmesh/shared/security/**', 'SECURITY.md', '.github/workflows/codeql.yml', '.github/workflows/dependency-review.yml']
'area:delivery':
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'deploy/**', 'scripts/**']
documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md']
dependencies:
  - changed-files:
      - any-glob-to-any-file: ['**/pyproject.toml', '**/uv.lock', '**/requirements*.txt', '.github/dependabot.yml']
