name: Release Gate
on:
  workflow_call:
    inputs:
      tag:
        description: Pushed canonical release tag matching all package versions
        required: true
        type: string
    secrets:
      OPSMESH_TEST_MODEL_API_KEY:
        required: true
permissions:
  contents: read
jobs:
  validation:
    uses: ./.github/workflows/v4-validation.yml
    with:
      full: true
    secrets:
      OPSMESH_TEST_MODEL_API_KEY: ${{ secrets.OPSMESH_TEST_MODEL_API_KEY }}
  gate:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: opsmesh
          POSTGRES_USER: opsmesh
          POSTGRES_PASSWORD: opsmesh
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U opsmesh" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      OPSMESH_DATABASE_URL: postgresql+psycopg://opsmesh:opsmesh@localhost:5432/opsmesh
      OPSMESH_REDIS_URL: redis://localhost:6379/0
      OPSMESH_ENVIRONMENT: test
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the pushed release tag to belong to master
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/master
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - run: uv run python -m scripts.release validate --tag "$RELEASE_TAG"
      - run: uv run ruff check . && uv run mypy
      - name: Architecture contracts
        run: uv run python scripts/ci_command.py uv run lint-imports --no-cache
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv build --all-packages
      - name: Verify the built operator wheel in a clean environment
        run: |
          uv venv /tmp/opsmesh-package-check
          uv pip install --python /tmp/opsmesh-package-check/bin/python dist/opsmesh_operator-*.whl
          /tmp/opsmesh-package-check/bin/opsmesh version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
