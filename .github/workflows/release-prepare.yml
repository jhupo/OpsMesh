name: Release Gate
on:
  workflow_call:
    inputs:
      tag:
        description: Pushed canonical release tag matching all package versions
        required: true
        type: string
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: opsmesh
          POSTGRES_USER: opsmesh
          POSTGRES_PASSWORD: opsmesh
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U opsmesh" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      OPSMESH_DATABASE_URL: postgresql+psycopg://opsmesh:opsmesh@localhost:5432/opsmesh
      OPSMESH_REDIS_URL: redis://localhost:6379/0
      OPSMESH_ENVIRONMENT: test
      OPSMESH_WORKER_HEARTBEAT_TOKEN: release-gate-only
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require the pushed release tag to belong to master
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/master
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - run: uv run python scripts/release.py validate --tag "$RELEASE_TAG"
      - run: uv run ruff check . && uv run mypy
      # Full-suite validation is restricted to tag-triggered release publication.
      - run: uv run python scripts/ci_command.py uv run pytest
        env:
          OPSMESH_CI_REPORT_PATH: reports/release-tests.log
      - name: Retain redacted test diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/release-tests.log
          if-no-files-found: warn
          retention-days: 14
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv build --all-packages
      - run: uv run python scripts/release.py bundle --tag "$RELEASE_TAG"
      - name: Verify the built operator wheel in a clean environment
        run: |
          uv venv /tmp/opsmesh-package-check
          uv pip install --python /tmp/opsmesh-package-check/bin/python dist/opsmesh_operator-*.whl
          /tmp/opsmesh-package-check/bin/opsmesh version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
