name: Backend CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    uses: ./.github/workflows/v4-validation.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.before }}
