name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opsmesh
          POSTGRES_USER: opsmesh
          POSTGRES_PASSWORD: opsmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsmesh -d opsmesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPSMESH_DATABASE_URL: postgresql+psycopg://opsmesh:opsmesh@localhost:5432/opsmesh
      OPSMESH_REDIS_URL: redis://localhost:6379/0
      OPSMESH_ENVIRONMENT: test
      OPSMESH_LOG_FORMAT: text
      OPSMESH_WORKER_HEARTBEAT_TOKEN: worker-heartbeat-secret
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Check Alembic drift
        run: uv run alembic check

      - name: Validate release bundle manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release-bundle
          cp pyproject.toml uv.lock README.md release-bundle/
          cp -R backend release-bundle/backend
          cp -R deploy/server/systemd release-bundle/systemd
          cp scripts/server-update.sh release-bundle/server-update.sh
          cp scripts/server-smoke-test.sh release-bundle/server-smoke-test.sh
          test -f release-bundle/backend/app/main.py
          test -f release-bundle/systemd/opsmesh-api.service
          test -f release-bundle/systemd/opsmesh-worker.service
