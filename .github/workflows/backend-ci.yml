name: Backend CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  planning-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: opsmesh
          POSTGRES_USER: opsmesh
          POSTGRES_PASSWORD: opsmesh
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U opsmesh" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - name: Planning concurrency on real PostgreSQL
        env:
          OPSMESH_TEST_POSTGRES_URL: postgresql+psycopg://opsmesh:opsmesh@127.0.0.1:5432/opsmesh
        run: uv run python scripts/ci_command.py uv run pytest backend/tests/test_agent_planning_postgres.py
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check . --output-format github
      - name: Architecture contracts
        run: uv run python scripts/ci_command.py uv run lint-imports --no-cache
      - name: Strict type checks
        run: uv run python scripts/ci_command.py uv run mypy
      - name: Focused tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run python scripts/ci_command.py uv run python scripts/ci_tests.py --base "$BASE_SHA"
