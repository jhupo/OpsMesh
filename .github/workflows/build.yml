name: Linux release bundles
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            architecture: x86_64
          - runner: ubuntu-22.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opsmesh_test
          POSTGRES_USER: opsmesh_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opsmesh_test -d opsmesh_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPSMESH_TEST_DSN: postgresql+asyncpg://opsmesh_test:isolated-ci-password@127.0.0.1:5432/opsmesh_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            packaging/requirements.lock
            packaging/plugins.lock
      - name: Install only framework and build dependencies
        run: |
          python -m pip install -r requirements.lock -r packaging/requirements.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - run: python scripts/build_packages.py --output dist/python
      - run: python scripts/build_release.py
      - run: python scripts/build_plugins.py
      - name: Verify core isolation and optional plugin runtime
        run: python scripts/smoke_release.py dist/opsmesh/opsmesh --plugin-path dist/plugins/site
      - name: Validate systemd unit and framework-only installer
        run: |
          shellcheck deploy/install.sh
          python scripts/test_installation.py dist
      - name: Check the optional container runs the same framework binary
        run: |
          docker build -f deploy/docker/Dockerfile -t opsmesh:verify dist/opsmesh
          docker run --rm opsmesh:verify --version
      - name: Upload separately verified Linux bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-${{ matrix.architecture }}
          path: |
            dist/opsmesh-*.tar.gz
            dist/opsmesh-*.sha256
          if-no-files-found: error
          retention-days: 14
