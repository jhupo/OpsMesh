name: Release Publish
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  managed-acceptance:
    needs: stage
    uses: ./.github/workflows/managed-delivery.yml
    permissions:
      # GitHub only exposes draft releases to credentials with push access.
      # The acceptance job uses this access solely to download the staged assets;
      # publication remains owned by the separate publish job below.
      contents: write
      attestations: read
      packages: read
    with:
      tag: ${{ github.ref_name }}
      # Verify this published baseline's declared schema boundary before any rollback.
      previous: v0.1.0rc9
  gate:
    uses: ./.github/workflows/release-prepare.yml
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
  standalone:
    needs: gate
    uses: ./.github/workflows/standalone.yml
    with:
      tag: ${{ github.ref_name }}
      wheels-artifact: release-packages-${{ github.run_id }}
  candidate:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.backend.outputs.digest }}
      runtime: ${{ steps.runtime.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - run: uv run python -m scripts.release validate --tag "$RELEASE_TAG"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: backend
        with:
          context: .
          file: deploy/images/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/jhupo/opsmesh:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: BUILD_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: runtime
        with:
          context: .
          file: deploy/images/Dockerfile.runtime
          push: true
          platforms: linux/amd64
          tags: ghcr.io/jhupo/opsmesh-runtime:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Test the exact candidate image digests
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          docker pull "ghcr.io/jhupo/opsmesh-runtime@$RUNTIME_DIGEST"
          docker pull "ghcr.io/jhupo/opsmesh@$BACKEND_DIGEST"
          uv run python scripts/check_runtime_image.py \
            --image "ghcr.io/jhupo/opsmesh-runtime@$RUNTIME_DIGEST" \
            --fixture backend/tests/fixtures/mcp_stdio_server.py
          docker run --rm "ghcr.io/jhupo/opsmesh@$BACKEND_DIGEST" python -c 'from backend.app.main import create_app; create_app()'
      - name: Verify fresh production Compose deployment using candidate digests
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          sudo env "PATH=$PATH" GITHUB_ACTIONS=true "DOCKER_CONFIG=$HOME/.docker" \
            "BACKEND_DIGEST=$BACKEND_DIGEST" "RUNTIME_DIGEST=$RUNTIME_DIGEST" \
            .venv/bin/python scripts/ci_command.py .venv/bin/python scripts/check_candidate.py
  stage:
    needs: [gate, candidate, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      BACKEND_DIGEST: ${{ needs.candidate.outputs.backend }}
      RUNTIME_DIGEST: ${{ needs.candidate.outputs.runtime }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: standalone-*-${{ github.run_id }}
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/jhupo/opsmesh
          subject-digest: ${{ needs.candidate.outputs.backend }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/jhupo/opsmesh-runtime
          subject-digest: ${{ needs.candidate.outputs.runtime }}
          push-to-registry: true
      - name: Create final release manifest
        run: |
          install -m 0755 deploy/install.sh dist/install.sh
          uv run python -m scripts.release manifest --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --backend-digest "$BACKEND_DIGEST" --runtime-digest "$RUNTIME_DIGEST"
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*
      - name: Stage attested release assets as an unpublished candidate
        run: |
          uv run python -m scripts.publish_release stage \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [stage, managed-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: dist
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the managed-accepted draft and version image tags
        run: |
          uv run python -m scripts.publish_release finalize \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
      - name: Verify public downloads and signed provenance
        run: |
          uv run python -m scripts.check_release --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
