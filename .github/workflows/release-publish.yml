name: Release Publish
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    uses: ./.github/workflows/release-prepare.yml
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - run: uv run python scripts/release.py validate --tag "$RELEASE_TAG"
      - run: uv build --all-packages
      - run: uv run python scripts/release.py bundle --tag "$RELEASE_TAG"
      - name: Verify installed CLI and backend packages
        run: |
          uv venv /tmp/opsmesh-package-check
          uv pip install --python /tmp/opsmesh-package-check/bin/python dist/opsmesh_operator-*.whl
          /tmp/opsmesh-package-check/bin/opsmesh version
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: backend
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/jhupo/opsmesh:${{ github.ref_name }}
          build-args: BUILD_COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: runtime
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          platforms: linux/amd64
          tags: ghcr.io/jhupo/opsmesh-runtime:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/jhupo/opsmesh
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/jhupo/opsmesh-runtime
          subject-digest: ${{ steps.runtime.outputs.digest }}
          push-to-registry: true
      - name: Create final release manifest
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          uv run python scripts/release.py manifest --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --backend-digest "$BACKEND_DIGEST" --runtime-digest "$RUNTIME_DIGEST"
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*
      - name: Publish complete release only
        run: |
          prerelease=false
          case "$RELEASE_TAG" in *rc*) prerelease=true ;; esac
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --generate-notes --prerelease="$prerelease"
          gh release edit "$RELEASE_TAG" --draft=false
