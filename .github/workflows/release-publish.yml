name: Release Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build VPS release bundle
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release-bundle
          mkdir -p release-bundle/deploy/server release-bundle/scripts
          cp pyproject.toml uv.lock README.md release-bundle/
          cp -R backend release-bundle/backend
          cp -R deploy/server/systemd release-bundle/deploy/server/systemd
          cp deploy/server/env.example release-bundle/deploy/server/env.example
          cp -R deploy/server/monitoring release-bundle/deploy/server/monitoring
          cp scripts/server-update.sh release-bundle/scripts/server-update.sh
          cp scripts/server-smoke-test.sh release-bundle/scripts/server-smoke-test.sh
          cat > release-bundle/manifest.json <<EOF
          {
            "schema_version": 1,
            "project": "opsmesh",
            "tag": "${GITHUB_REF_NAME}",
            "version": "${GITHUB_REF_NAME#v}",
            "commit": "${GITHUB_SHA}",
            "deployment_mode": "systemd",
            "systemd_units": [
              "deploy/server/systemd/opsmesh-api.service",
              "deploy/server/systemd/opsmesh-worker.service"
            ],
            "update_script": "scripts/server-update.sh",
            "smoke_script": "scripts/server-smoke-test.sh"
          }
          EOF
          (cd release-bundle && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -czf opsmesh-server-${GITHUB_REF_NAME}.tar.gz release-bundle
          bundle_sha256="$(sha256sum opsmesh-server-${GITHUB_REF_NAME}.tar.gz | awk '{print $1}')"
          echo "${bundle_sha256}  opsmesh-server-${GITHUB_REF_NAME}.tar.gz" > opsmesh-server-${GITHUB_REF_NAME}.tar.gz.sha256
          cat > opsmesh-server-${GITHUB_REF_NAME}-manifest.json <<EOF
          {
            "schema_version": 1,
            "project": "opsmesh",
            "tag": "${GITHUB_REF_NAME}",
            "version": "${GITHUB_REF_NAME#v}",
            "commit": "${GITHUB_SHA}",
            "bundle": {
              "name": "opsmesh-server-${GITHUB_REF_NAME}.tar.gz",
              "url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/opsmesh-server-${GITHUB_REF_NAME}.tar.gz",
              "sha256": "${bundle_sha256}"
            },
            "deployment_mode": "systemd",
            "systemd_units": [
              "deploy/server/systemd/opsmesh-api.service",
              "deploy/server/systemd/opsmesh-worker.service"
            ],
            "update_script": "scripts/server-update.sh",
            "smoke_script": "scripts/server-smoke-test.sh"
          }
          EOF

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            opsmesh-server-${{ github.ref_name }}-manifest.json
            opsmesh-server-${{ github.ref_name }}.tar.gz
            opsmesh-server-${{ github.ref_name }}.tar.gz.sha256
