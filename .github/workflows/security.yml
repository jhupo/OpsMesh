name: Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL SAST (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  audit:
    name: Dependency Audit & Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security scanners and package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[all]" bandit pip-audit ruff
      - name: Ruff security lint (Bandit S rules)
        run: ruff check --select S src
      - name: Bandit static security scan
        run: bandit -r src/opsmesh -ll -ii
      - name: Dependency CVE audit (pip-audit)
        run: |
          pip-audit -r requirements.txt --strict
          pip-audit --skip-editable
