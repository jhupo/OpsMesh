name: Security
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --extra sandbox --no-editable --no-emit-project --no-emit-package opsmesh-sdk --no-hashes --format requirements-txt --output-file /tmp/opsmesh-export.txt
          python scripts/audit_requirements.py /tmp/opsmesh-export.txt /tmp/opsmesh-requirements.txt
          uvx --from pip-audit pip-audit --requirement /tmp/opsmesh-requirements.txt --disable-pip --no-deps
      - name: Scan sources and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: .git,.venv,data,.cache
          format: json
          output: source-security.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-security
          path: source-security.json
          if-no-files-found: ignore
