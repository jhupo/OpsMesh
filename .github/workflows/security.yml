name: Security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Dependency Audit & Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install security scanners and package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[all]" bandit pip-audit ruff
      - name: Ruff security lint (Bandit S rules)
        run: ruff check --select S src
      - name: Bandit static security scan
        run: bandit -r src/opsmesh -ll -ii
      - name: Dependency CVE audit (pip-audit)
        run: |
          pip-audit -r requirements.txt --strict
          pip-audit --skip-editable
