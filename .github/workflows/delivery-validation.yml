name: Delivery Integration
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['src/**', 'sdk/**', 'pyproject.toml', 'uv.lock', 'deploy/**', 'migrations/**', 'scripts/check_runtime_image.py', 'tests/fixtures/mcp_stdio_server.py', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'sdk/**', 'pyproject.toml', 'uv.lock', 'deploy/**', 'migrations/**', 'scripts/check_runtime_image.py', 'tests/fixtures/mcp_stdio_server.py', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - run: uv run pytest deploy/cli/tests
      - name: Fresh container deployment through the current migration chain
        run: |
          cp deploy/local/env.example .env
          docker compose -p opsmesh-delivery -f deploy/local/compose.yml up --build storage-init
          docker compose -p opsmesh-delivery -f deploy/local/compose.yml up -d --build postgres redis temporal-namespace
          uv run python -m opsmesh_operator.compose --timeout 180 -- docker compose -p opsmesh-delivery -f deploy/local/compose.yml
          docker compose -p opsmesh-delivery -f deploy/local/compose.yml run --rm --no-deps migrate
          docker compose -p opsmesh-delivery -f deploy/local/compose.yml up -d --no-deps --build --wait --wait-timeout 180 api worker
          curl --fail http://127.0.0.1:8000/api/v1/health/ready
          curl --fail http://127.0.0.1:9000/metrics | grep 'opsmesh_metrics_collection_success{source="postgres"} 1.0'
      - name: Native sandbox command, file, resume and MCP stdio
        run: |
          docker build -f deploy/images/Dockerfile.runtime -t opsmesh-compute:delivery .
          uv run python scripts/check_runtime_image.py --image opsmesh-compute:delivery
      - name: Remove disposable deployment
        if: always()
        run: |
          if [ -f .env ]; then docker compose -p opsmesh-delivery -f deploy/local/compose.yml down --volumes; fi
