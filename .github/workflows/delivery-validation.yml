name: Delivery Integration
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'operator/**'
      - 'deploy/**'
      - 'src/opsmesh/platform/updates/**'
      - 'src/opsmesh/runtime/**'
      - 'src/opsmesh/capabilities/mcp/**'
      - 'migrations/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'operator/**'
      - 'deploy/**'
      - 'src/opsmesh/platform/updates/**'
      - 'src/opsmesh/runtime/**'
      - 'src/opsmesh/capabilities/mcp/**'
      - 'migrations/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: opsmesh
          POSTGRES_USER: opsmesh
          POSTGRES_PASSWORD: opsmesh
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U opsmesh" --health-interval 5s --health-retries 10
    env:
      OPSMESH_ENVIRONMENT: test
      OPSMESH_DATABASE_URL: postgresql+psycopg://opsmesh:opsmesh@127.0.0.1:5432/opsmesh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - run: uv run mypy operator/opsmesh_operator src/opsmesh/platform/updates
      - run: uv run pytest tests/test_platform_updates.py tests/test_operator_security.py tests/test_release_delivery.py
      - name: Real PostgreSQL migrations and delivery contracts
        env:
          OPSMESH_DELIVERY_POSTGRES_TEST: '1'
        run: |
          uv run python scripts/ci_command.py uv run alembic upgrade head
          uv run python scripts/ci_command.py uv run alembic check
          uv run python scripts/ci_command.py uv run pytest tests/test_delivery_postgres.py
      - name: Fresh container deployment and runtime probe
        run: |
          cp deploy/local/env.example .env
          docker compose -f deploy/local/compose.yml up --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8000/api/v1/health/ready
          docker build -f deploy/images/Dockerfile.runtime -t opsmesh-runtime:ci .
          uv run python scripts/check_runtime_image.py \
            --image opsmesh-runtime:ci \
            --fixture tests/fixtures/mcp_stdio_server.py
      - name: Real backup restoration and tamper denial
        run: |
          sudo env "PATH=$PATH" OPSMESH_ENVIRONMENT=test OPSMESH_DELIVERY_BACKUP_TEST=1 \
            "OPSMESH_DATABASE_URL=$OPSMESH_DATABASE_URL" \
            .venv/bin/python scripts/ci_command.py .venv/bin/python -m pytest tests/test_delivery_backup_linux.py
      - name: Tear down disposable CI deployment
        if: always()
        run: |
          if [ -f .env ]; then docker compose -f deploy/local/compose.yml down --volumes; fi
