name: V4 Product Validation
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      base:
        type: string
        default: ''
    secrets:
      OPSMESH_TEST_MODEL_API_KEY:
        description: Isolated acceptance model credential, required for full release validation
        required: false
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: opsmesh
          POSTGRES_USER: opsmesh
          POSTGRES_PASSWORD: opsmesh
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U opsmesh" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      OPSMESH_ENVIRONMENT: test
      OPSMESH_DATABASE_URL: postgresql+psycopg://opsmesh:opsmesh@127.0.0.1:5432/opsmesh
      OPSMESH_TEST_DATABASE_URL: postgresql+psycopg://opsmesh:opsmesh@127.0.0.1:5432/opsmesh
      OPSMESH_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      OPSMESH_TEST_TEMPORAL_ADDRESS: 127.0.0.1:7233
      OPSMESH_TEST_TEMPORAL_LOCAL: '1'
      OPSMESH_TEST_SANDBOX_IMAGE: opsmesh-compute:ci
      OPSMESH_TEST_EXTENSION_ARTIFACT: opsmesh-extension-builder:ci
      OPSMESH_TEST_EXTENSION_BUILDER_IMAGE: opsmesh-extension-builder:ci
      OPSMESH_TEST_MANAGED_PRODUCT: '1'
      OPSMESH_TEST_SDK_WHEEL: ${{ github.workspace }}/.tmp/extension-sdk/opsmesh_sdk-0.1.0rc23-py3-none-any.whl
      BASE_SHA: ${{ inputs.base }}
      FULL_VALIDATION: ${{ inputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - name: Persistent Temporal for waits, cancellation and replay
        run: |
          docker compose -p v4-ci -f deploy/temporal/compose.yml up -d temporal-namespace
          uv run python -m opsmesh_operator.compose --timeout 180 -- docker compose -p v4-ci -f deploy/temporal/compose.yml
      - name: Approved native sandbox
        run: |
          docker build -f deploy/images/Dockerfile.runtime \
            --build-arg "SANDBOX_UID=$(id -u)" --build-arg "SANDBOX_GID=$(id -g)" \
            -t "$OPSMESH_TEST_SANDBOX_IMAGE" .
      - name: Approved extension builder
        run: |
          docker build -f deploy/images/Dockerfile --target extension-builder -t "$OPSMESH_TEST_EXTENSION_BUILDER_IMAGE" .
          uv build --package opsmesh-sdk --out-dir .tmp/extension-sdk
      - run: uv run ruff check . --output-format github
      - run: uv run mypy
      - run: uv run lint-imports --no-cache
      - run: uv run python scripts/audit_app_layout.py --architecture-check
      - run: uv run python scripts/audit_refactor_manifest.py --check
      - run: uv run python scripts/export_api_docs.py --check
      - run: uv run python scripts/generate_sdk_api.py --check
      - run: uv run python scripts/export_compute_requirements.py --check
      - name: Empty database initial schema and complete model comparison
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run pytest tests/engineering/test_initial_schema.py
      - name: Current feature tests and dependent boundaries
        env:
          OPSMESH_CI_REPORT_PATH: reports/v4-tests.log
        run: |
          if [ "$FULL_VALIDATION" = true ] || [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            uv run python scripts/ci_command.py uv run pytest tests operator/tests sdk/python/tests
          else
            uv run python scripts/ci_command.py uv run python scripts/ci_tests.py --base "$BASE_SHA"
          fi
      - name: Independent SDK contracts
        working-directory: sdk/python
        run: |
          uv run ruff check .
          uv run mypy
          uv run lint-imports --no-cache
          uv run pytest tests
      - name: Mandatory real product acceptance for release
        if: inputs.full
        env:
          OPSMESH_TEST_MODEL_API_KEY: ${{ secrets.OPSMESH_TEST_MODEL_API_KEY }}
          OPSMESH_TEST_MODEL_BASE_URL: ${{ vars.OPSMESH_TEST_MODEL_BASE_URL }}
          OPSMESH_TEST_MODEL_NAME: ${{ vars.OPSMESH_TEST_MODEL_NAME }}
          OPSMESH_TEST_MODEL_REASONING_EFFORT: ${{ vars.OPSMESH_TEST_MODEL_REASONING_EFFORT || 'medium' }}
          OPSMESH_CI_REPORT_PATH: reports/v4-products.log
        run: uv run python scripts/ci_command.py uv run python scripts/check_product_acceptance.py
      - name: Independent wheels and installed application boundary
        run: |
          uv build --all-packages --out-dir .tmp/package-check
          uv run python scripts/check_python_package.py --wheel .tmp/package-check/opsmesh-*.whl
          uv venv /tmp/v4-sdk-check
          uv pip install --python /tmp/v4-sdk-check/bin/python .tmp/package-check/opsmesh_sdk-*.whl
          cd /tmp
          /tmp/v4-sdk-check/bin/python -I -c "import opsmesh_sdk; from opsmesh_sdk.api.orchestration import create_orchestration_client; import opsmesh_sdk.runtime.loading; import opsmesh_sdk.runtime.managed; import importlib.util; assert importlib.util.find_spec('opsmesh') is None"
      - name: Redacted diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v4-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/v4-tests.log
            reports/v4-products.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove disposable Temporal data
        if: always()
        run: docker compose -p v4-ci -f deploy/temporal/compose.yml down --volumes
