name: Standalone Distributions
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      wheels-artifact:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      component:
        description: Focused acceptance scope (tag publication always builds every platform)
        type: choice
        options: [all, server]
        default: all
      tag:
        description: Version of the current checkout (build and acceptance only; no publication)
        required: true
        type: string
permissions:
  contents: read
jobs:
  cli:
    if: github.event_name != 'workflow_dispatch' || inputs.component == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-amd64
            extension: tar.gz
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            extension: tar.gz
          - runner: windows-2022
            target: windows-amd64
            extension: zip
          - runner: macos-15-intel
            target: darwin-amd64
            extension: tar.gz
          - runner: macos-14
            target: darwin-arm64
            extension: tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.12.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.wheels-artifact != ''
        with:
          name: ${{ inputs.wheels-artifact }}
          path: wheels
      - if: inputs.wheels-artifact == ''
        run: uv build --package opsmesh-operator --wheel --out-dir wheels
      - name: Build native CLI from the locked wheel
        run: uv run --no-project python scripts/build_standalone.py --kind cli --tag "$RELEASE_TAG" --wheels wheels
      - name: Verify relocated CLI without system Python
        run: uv run --no-project python scripts/check_standalone.py --kind cli --tag "$RELEASE_TAG" --archive "dist/opsmesh-cli-$RELEASE_TAG-${{ matrix.target }}.${{ matrix.extension }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-cli-${{ matrix.target }}-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_DB: opsmesh
          POSTGRES_USER: opsmesh
          POSTGRES_PASSWORD: opsmesh
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U opsmesh" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      OPSMESH_DATABASE_URL: postgresql+psycopg://opsmesh:opsmesh@127.0.0.1:5432/opsmesh
      OPSMESH_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.12.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.wheels-artifact != ''
        with:
          name: ${{ inputs.wheels-artifact }}
          path: wheels
      - if: inputs.wheels-artifact == ''
        run: uv build --all-packages --wheel --out-dir wheels
      - name: Build self-contained server from locked wheels and CPython
        run: uv run --no-project python scripts/build_standalone.py --kind server --tag "$RELEASE_TAG" --wheels wheels
      - name: Verify relocation, real migrations, API, worker and updater without system Python
        run: uv run --no-project python scripts/check_standalone.py --kind server --tag "$RELEASE_TAG" --archive "dist/opsmesh-server-$RELEASE_TAG-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-server-linux-amd64-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
