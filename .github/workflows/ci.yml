name: Static checks
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra sandbox --extra build
      - run: uv run --no-sync ruff format --check src sdk/python/src sdk/python/examples examples tests scripts
      - run: uv run --no-sync ruff check src sdk/python/src sdk/python/examples examples tests scripts
      - run: uv run --no-sync mypy
      - run: uv run --no-sync lint-imports --no-cache
      - run: uv run --no-sync mypy --python-version 3.11 sdk/python/src
      - run: uv run --no-sync python scripts/release_assets.py check-version
      - run: bash -n deploy/install.sh
      - run: bash -n deploy/setup.sh
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opsmesh_test
          POSTGRES_USER: opsmesh_test
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsmesh_test -d opsmesh_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPSMESH_TEST_DATABASE_URL: postgresql+psycopg://opsmesh_test:isolated-ci-test-password@127.0.0.1:5432/opsmesh_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra sandbox
      - run: uv run --no-sync python -m unittest discover -s tests -v
