name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps . ./packages/channels ./packages/database ./packages/execution ./packages/filesystem
      - run: python -m pip check
      - run: python -m pytest tests/unit -q
      - name: Check deployment scripts
        run: shellcheck deploy/install.sh
  packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r packaging/requirements.lock
      - run: python scripts/build_packages.py --output dist/python
      - name: Install core wheel in a clean environment
        run: |
          python -m venv /tmp/opsmesh-core-check
          /tmp/opsmesh-core-check/bin/pip install -c requirements.lock dist/python/opsmesh-*.whl
          cd /tmp
          /tmp/opsmesh-core-check/bin/python -I -c 'import importlib.util,opsmesh; assert importlib.util.find_spec("agents") is None; assert importlib.util.find_spec("sqlalchemy") is None; assert importlib.util.find_spec("opsmesh_channels") is None'
      - name: Install each plugin wheel with its declared dependencies
        run: |
          for plugin in channels database execution filesystem; do
            python -m venv "/tmp/opsmesh-$plugin-check"
            "/tmp/opsmesh-$plugin-check/bin/pip" install -c requirements-dev.lock dist/python/opsmesh-*.whl dist/python/opsmesh_${plugin}-*.whl
            "/tmp/opsmesh-$plugin-check/bin/pip" check
            (cd /tmp && "/tmp/opsmesh-$plugin-check/bin/python" -I -c "import opsmesh_$plugin")
          done
      - name: Upload Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-python
          path: |
            dist/python/*.whl
            dist/python/*.tar.gz
          if-no-files-found: error
          retention-days: 14
  binary:
    uses: ./.github/workflows/build.yml
