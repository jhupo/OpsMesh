name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-plugin-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install and exercise the service on systemd
        run: |
          python -m pip wheel --wheel-dir /tmp/opsmesh-wheels . ./src/opsmesh-cli
          python -m pip install pytest
          python -m pip install --no-index --find-links /tmp/opsmesh-wheels opsmesh-cli
          python -I -m pytest -o pythonpath= tests/unit/test_cli_management.py -q
          sudo bash deploy/install.sh /tmp/opsmesh-wheels "$(command -v python)"
          OPSMESH_DISPOSABLE_SYSTEMD_TEST=1 python -I -m pytest -o pythonpath= tests/integration/test_linux_service.py -q
      - name: Show startup diagnostics on failure
        if: failure()
        run: sudo journalctl -u opsmesh.service -n 100 --no-pager
  python:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps . ./src/opsmesh-cli ./packages/database ./packages/filesystem ./packages/qq ./packages/dingtalk
      - run: python -m pip check
      - run: python -m pytest tests/unit -q
  packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r packaging/requirements.lock
      - run: python scripts/build_packages.py --output dist/python
      - name: Install core wheel in a clean environment
        run: |
          python -m venv /tmp/opsmesh-core-check
          /tmp/opsmesh-core-check/bin/pip install -c requirements.lock dist/python/opsmesh-*.whl
          test ! -e /tmp/opsmesh-core-check/bin/opsmesh
          cd /tmp
          /tmp/opsmesh-core-check/bin/python -I -c 'import importlib.util,opsmesh; assert importlib.util.find_spec("opsmesh.service") is None; assert importlib.util.find_spec("uvicorn") is None; assert importlib.util.find_spec("agents") is None; assert importlib.util.find_spec("sqlalchemy") is None; assert importlib.util.find_spec("opsmesh.plugins.channels") is None'
      - name: Smoke-test the standalone CLI wheel without plugins or service
        run: |
          python -m venv /tmp/opsmesh-cli-check
          /tmp/opsmesh-cli-check/bin/pip install -c requirements-dev.lock dist/python/opsmesh-*.whl dist/python/opsmesh_cli-*.whl
          cd /tmp/opsmesh-cli-check
          bin/opsmesh --version
          bin/opsmesh service --help
          status=0
          printf 'run = "%s/offline"\n' "$PWD" > offline.toml
          bin/opsmesh --config offline.toml --json plugin list > response.json || status=$?
          test "$status" -eq 6
          bin/python -I -c 'import json; r=json.load(open("response.json")); assert not r["ok"] and r["error"]["code"] == "service_unavailable"'
      - name: Install each plugin wheel with its declared dependencies
        run: |
          for plugin in database filesystem; do
            python -m venv "/tmp/opsmesh-$plugin-check"
            "/tmp/opsmesh-$plugin-check/bin/pip" install -c requirements-dev.lock --find-links dist/python dist/python/opsmesh-*.whl dist/python/opsmesh_${plugin}-*.whl
            "/tmp/opsmesh-$plugin-check/bin/pip" check
            (cd /tmp && "/tmp/opsmesh-$plugin-check/bin/python" -I - "$plugin" <<'PY'
          import sys
          import opsmesh

          opsmesh.init(driver="~none")
          assert opsmesh.load_plugin(sys.argv[1]) is not None
          PY
            )
          done
      - name: Verify the independent QQ wheel
        run: |
          python -m venv /tmp/opsmesh-qq-check
          /tmp/opsmesh-qq-check/bin/pip install -c requirements-dev.lock dist/python/opsmesh-*.whl dist/python/opsmesh_qq-*.whl
          /tmp/opsmesh-qq-check/bin/pip check
          cd /tmp
          /tmp/opsmesh-qq-check/bin/python -I -c 'import opsmesh; opsmesh.init(driver="~aiohttp"); plugin = opsmesh.load_plugin("qq"); assert plugin; plugin.manager.enable_plugin(plugin); opsmesh.get_driver().run = lambda: None; opsmesh.run(); assert opsmesh.get_adapter("qq")'
      - name: Verify DingTalk and QQ independent loading
        run: |
          python -m venv /tmp/opsmesh-adapters-check
          /tmp/opsmesh-adapters-check/bin/pip install -c requirements-dev.lock dist/python/opsmesh-*.whl dist/python/opsmesh_qq-*.whl dist/python/opsmesh_dingtalk-*.whl pytest
          /tmp/opsmesh-adapters-check/bin/pip check
          /tmp/opsmesh-adapters-check/bin/python -I -m pytest -o pythonpath= tests/unit/test_dingtalk_adapter.py -q
      - name: Upload Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-python
          path: |
            dist/python/*.whl
            dist/python/*.tar.gz
          if-no-files-found: error
          retention-days: 14
  knowledge:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: opsmesh_test
          POSTGRES_USER: opsmesh_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opsmesh_test -d opsmesh_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPSMESH_TEST_DSN: postgresql+asyncpg://opsmesh_test:isolated-ci-password@127.0.0.1:5432/opsmesh_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps . ./packages/database ./packages/filesystem
      - run: python -m pip check
      # PostgreSQL tests use a fake encoder; do not download model dependencies.
      - run: python -m pip install --no-deps ./packages/knowledge
      - name: Prepare isolated vector test database
        env:
          PGPASSWORD: isolated-ci-password
        run: psql -h 127.0.0.1 -U opsmesh_test -d opsmesh_test -f tests/postgres-init.sql
      - run: python -m pytest tests/integration/test_knowledge_postgresql.py -q
