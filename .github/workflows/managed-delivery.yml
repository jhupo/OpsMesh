name: Managed Delivery Acceptance
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Staged release containing the deployment CLI under test
        required: true
        type: string
permissions:
  # GitHub only includes unpublished candidate releases for credentials with
  # push access. This workflow downloads and exercises those exact assets; it
  # never publishes or modifies the release.
  contents: write
  attestations: read
  packages: read
jobs:
  managed:
    strategy:
      fail-fast: false
      matrix:
        mode: [compose, systemd]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      DEPLOYMENT_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - name: Prepare external infrastructure for systemd only
        if: matrix.mode == 'systemd'
        run: |
          acceptance_pg_password=$(openssl rand -hex 32)
          acceptance_temporal_password=$(openssl rand -hex 32)
          echo "::add-mask::$acceptance_pg_password"
          echo "::add-mask::$acceptance_temporal_password"
          printf 'ACCEPTANCE_POSTGRES_PASSWORD=%s\n' "$acceptance_pg_password" >> "$GITHUB_ENV"
          printf 'ACCEPTANCE_TEMPORAL_POSTGRES_PASSWORD=%s\n' "$acceptance_temporal_password" >> "$GITHUB_ENV"
          docker run -d --name acceptance-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_DB=opsmesh -e POSTGRES_USER=opsmesh -e "POSTGRES_PASSWORD=$acceptance_pg_password" \
            --health-cmd 'pg_isready -U opsmesh' --health-interval 2s --health-retries 30 \
            postgres:16-bookworm
          docker run -d --name acceptance-redis -p 127.0.0.1:6379:6379 redis:7-alpine
          printf 'OPSMESH_TEMPORAL_POSTGRES_PASSWORD=%s\n' "$acceptance_temporal_password" > /tmp/opsmesh-acceptance-temporal.env
          chmod 600 /tmp/opsmesh-acceptance-temporal.env
          printf 'services:\n  temporal-postgres:\n    ports: ["127.0.0.1:5433:5432"]\n' > /tmp/opsmesh-acceptance-temporal-ports.yml
          docker compose --env-file /tmp/opsmesh-acceptance-temporal.env -p acceptance-temporal -f deploy/temporal/compose.yml -f /tmp/opsmesh-acceptance-temporal-ports.yml up -d temporal-namespace
          uv run python -m opsmesh_operator.compose --timeout 180 -- docker compose --env-file /tmp/opsmesh-acceptance-temporal.env -p acceptance-temporal -f deploy/temporal/compose.yml -f /tmp/opsmesh-acceptance-temporal-ports.yml
          sudo tee /etc/systemd/system/opsmesh-acceptance-temporal.service >/dev/null <<EOF
          [Unit]
          Description=Disposable OpsMesh Temporal acceptance service
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/bin/docker compose --env-file /tmp/opsmesh-acceptance-temporal.env -p acceptance-temporal -f $GITHUB_WORKSPACE/deploy/temporal/compose.yml -f /tmp/opsmesh-acceptance-temporal-ports.yml up -d --no-deps --wait temporal
          ExecStop=/usr/bin/docker compose --env-file /tmp/opsmesh-acceptance-temporal.env -p acceptance-temporal -f $GITHUB_WORKSPACE/deploy/temporal/compose.yml -f /tmp/opsmesh-acceptance-temporal-ports.yml stop temporal
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl start opsmesh-acceptance-temporal.service
      - name: Attested fresh install, real flow, complete snapshot restore and tamper denial
        run: |
          sudo env "PATH=$PATH" "OPSMESH_RELEASE_TOKEN=$GH_TOKEN" GITHUB_ACTIONS=true \
            "ACCEPTANCE_POSTGRES_PASSWORD=${ACCEPTANCE_POSTGRES_PASSWORD:-}" \
            "ACCEPTANCE_TEMPORAL_POSTGRES_PASSWORD=${ACCEPTANCE_TEMPORAL_POSTGRES_PASSWORD:-}" \
            .venv/bin/python scripts/ci_command.py .venv/bin/python scripts/check_managed_delivery.py \
            --tag "$RELEASE_TAG" --mode "$DEPLOYMENT_MODE"
      - name: Redacted service diagnostics on failure
        if: failure()
        run: |
          sudo .venv/bin/python scripts/ci_command.py journalctl \
            -u opsmesh-acceptance-temporal -u opsmesh-api -u opsmesh-worker --no-pager -n 150
