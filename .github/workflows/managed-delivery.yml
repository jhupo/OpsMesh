name: Managed Delivery Acceptance
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      previous:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published release containing the independent updater under test
        required: true
        type: string
      previous:
        description: Published baseline; incompatible rollback must be rejected
        required: true
        default: v0.1.0rc9
        type: string
permissions:
  # GitHub only includes unpublished candidate releases for credentials with
  # push access. This workflow downloads and exercises those exact assets; it
  # never publishes or modifies the release.
  contents: write
  attestations: read
  packages: read
jobs:
  managed:
    strategy:
      fail-fast: false
      matrix:
        mode: [compose, systemd]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      PREVIOUS_TAG: ${{ inputs.previous }}
      DEPLOYMENT_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - name: Prepare external infrastructure for systemd only
        if: matrix.mode == 'systemd'
        run: |
          acceptance_pg_password=$(openssl rand -hex 32)
          echo "::add-mask::$acceptance_pg_password"
          printf 'ACCEPTANCE_POSTGRES_PASSWORD=%s\n' "$acceptance_pg_password" >> "$GITHUB_ENV"
          docker run -d --name acceptance-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_DB=opsmesh -e POSTGRES_USER=opsmesh -e "POSTGRES_PASSWORD=$acceptance_pg_password" \
            --health-cmd 'pg_isready -U opsmesh' --health-interval 2s --health-retries 30 \
            pgvector/pgvector:0.8.6-pg16-bookworm
          docker run -d --name acceptance-redis -p 127.0.0.1:6379:6379 redis:7-alpine
      - name: Signed native install, cross-version upgrade and real interruption recovery
        run: |
          sudo env "PATH=$PATH" "OPSMESH_RELEASE_TOKEN=$GH_TOKEN" GITHUB_ACTIONS=true \
            "ACCEPTANCE_POSTGRES_PASSWORD=${ACCEPTANCE_POSTGRES_PASSWORD:-}" \
            .venv/bin/python scripts/ci_command.py .venv/bin/python scripts/check_managed_delivery.py \
            --tag "$RELEASE_TAG" --previous "$PREVIOUS_TAG" --mode "$DEPLOYMENT_MODE"
      - name: Redacted service diagnostics on failure
        if: failure()
        run: |
          sudo .venv/bin/python scripts/ci_command.py journalctl \
            -u opsmesh-updater -u opsmesh-api -u opsmesh-worker --no-pager -n 150
