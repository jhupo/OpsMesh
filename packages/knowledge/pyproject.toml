[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmesh-knowledge"
version = "0.6.0"
description = "Owned PostgreSQL knowledge bases and native Agents SDK tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-core.txt", "requirements-plugins.txt", "requirements.txt"]}

[tool.setuptools]
packages = ["knowledge", "knowledge.migrations"]
package-dir = {knowledge = "src"}

[tool.setuptools.package-data]
knowledge = ["config.json", "py.typed"]

[project.urls]
Repository = "https://github.com/jhupo/OpsMesh"
