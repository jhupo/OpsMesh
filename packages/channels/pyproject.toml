[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmesh-channels"
version = "0.5.1"
description = "OpsMesh channels plugin"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-core.txt", "requirements.txt"]}

[tool.setuptools]
package-dir = {"opsmesh.plugins.channels" = "src"}

[project.entry-points."opsmesh.plugins"]
channels = "opsmesh.plugins.channels"

[tool.setuptools.package-data]
"opsmesh.plugins.channels" = ["py.typed"]

[project.urls]
Repository = "https://github.com/jhupo/OpsMesh"
Issues = "https://github.com/jhupo/OpsMesh/issues"
Documentation = "https://github.com/jhupo/OpsMesh/tree/master/docs"
