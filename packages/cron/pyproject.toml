[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmesh-cron"
version = "0.5.1"
description = "Persistent APScheduler events for OpsMesh plugins"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-core.txt", "requirements-plugins.txt", "requirements.txt"]}

[tool.setuptools]
package-dir = {"opsmesh.plugins.cron" = "src"}

[project.entry-points."opsmesh.plugins"]
cron = "opsmesh.plugins.cron"

[tool.setuptools.package-data]
"opsmesh.plugins.cron" = ["py.typed", "migrations/*.py"]
