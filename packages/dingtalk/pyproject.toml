[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmesh-dingtalk"
version = "0.6.0"
description = "DingTalk Stream adapter for OpsMesh"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools]
packages = ["dingtalk", "dingtalk.protocol", "dingtalk.attachments", "dingtalk.messages"]
package-dir = {dingtalk = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-core.txt", "requirements.txt"]}
