[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmesh-qq"
version = "0.6.0"
description = "QQ protocol adapter for OpsMesh"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.urls]
Upstream = "https://github.com/nonebot/adapter-qq/tree/11c099152f0c3aa68dffdf1eee103508ab866bca"

[tool.setuptools]
packages = ["qq", "qq.models"]
package-dir = {"qq" = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-core.txt", "requirements.txt"]}
