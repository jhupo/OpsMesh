[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmesh-database"
version = "0.4.0"
description = "OpsMesh database plugin"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-core.txt", "requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["opsmesh_database*"]

[tool.setuptools.package-data]
"opsmesh_database" = ["py.typed", "_alembic/script.py.mako"]

[project.urls]
Repository = "https://github.com/jhupo/OpsMesh"
Issues = "https://github.com/jhupo/OpsMesh/issues"
Documentation = "https://github.com/jhupo/OpsMesh/tree/master/docs"
