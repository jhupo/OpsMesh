[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsmesh-service"
version = "0.5.8"
description = "OpsMesh host service and local administration CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["opsmesh==0.5.8"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
opsmesh = "opsmesh.service.cli:main"

[tool.setuptools]
packages = ["opsmesh.service"]
package-dir = {"opsmesh.service" = "src"}

[project.urls]
Repository = "https://github.com/jhupo/OpsMesh"
Issues = "https://github.com/jhupo/OpsMesh/issues"
Documentation = "https://github.com/jhupo/OpsMesh/tree/master/docs"
