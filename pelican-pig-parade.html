<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican &amp; Pig / A Little Ride</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #bce9f5; color: #24394a; font-family: system-ui, sans-serif; }
    main { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; }
    header, footer { padding: 22px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: 0; }
    header span, footer { font-size: 12px; }
    .landscape { width: 100%; display: grid; align-items: center; overflow: hidden; }
    svg { width: 100%; height: auto; display: block; max-height: 76svh; }
    button { width: 42px; height: 42px; padding: 10px; border: 1px solid #24394a55; border-radius: 50%; color: inherit; background: #ffffff66; cursor: pointer; }
    button:hover { background: white; }
    button:focus-visible { outline: 3px solid #224b86; outline-offset: 4px; }
    button svg { width: 20px; height: 20px; }
    .play-icon { display: none; }
    button[aria-pressed="true"] .play-icon { display: block; }
    button[aria-pressed="true"] .pause-icon { display: none; }
    .outline { stroke: #384455; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .clouds { animation: travel 55s linear infinite; }
    .hills { animation: travel 22s linear infinite; }
    .grass { animation: travel 4s linear infinite; }
    .ride { animation: bounce .7s ease-in-out infinite; }
    .bird { transform-origin: 480px 340px; animation: sway .7s ease-in-out infinite; }
    .leg { transform-box: fill-box; transform-origin: 50% 0%; animation: step .7s ease-in-out infinite; }
    .opposite { animation-delay: -.35s; }
    .wing { transform-origin: 459px 270px; animation: flap 1.4s ease-in-out infinite; }
    .scarf { transform-origin: 497px 221px; animation: flutter .7s ease-in-out infinite; }
    .ear { transform-origin: 617px 327px; animation: flutter .7s ease-in-out infinite reverse; }
    .tail { transform-origin: 330px 365px; animation: flutter .7s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
    .shadow { transform-origin: 490px 455px; animation: shadow .7s ease-in-out infinite; }
    .dust { transform-box: fill-box; transform-origin: center; animation: puff 1.4s ease-out infinite; }
    .dust.second { animation-delay: -.7s; }
    .paused * { animation-play-state: paused !important; }
    @keyframes travel { to { transform: translateX(-1000px); } }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateY(-2px); } }
    @keyframes step { 0%,100% { transform: rotate(25deg); } 50% { transform: rotate(-25deg); } }
    @keyframes flap { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-12deg); } }
    @keyframes flutter { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }
    @keyframes blink { 0%,45%,49%,100% { transform: scaleY(1); } 47% { transform: scaleY(.1); } }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .18; } 50% { transform: scaleX(.88); opacity: .1; } }
    @keyframes puff { 0% { opacity: 0; transform: scale(.3); } 20% { opacity: .65; } 100% { opacity: 0; transform: translate(-65px,-18px) scale(1.4); } }
    @media (max-width: 600px) { header,footer { padding: 18px; } header span { display: none; } h1 { font-size: 20px; } .landscape { min-height: 300px; } svg { min-height: 280px; } button svg { min-height: 0; } }
    @media (prefers-reduced-motion: reduce) { #scene * { animation: none; } }
  </style>
</head>
<body>

            <g fill="#fffef3"><circle cx="157" cy="518" r="4"/><circle cx="598" cy="472" r="4"/><circle cx="820" cy="536" r="4"/></g>
            <g fill="#f1c556"><circle cx="157" cy="518" r="1.5"/><circle cx="598" cy="472" r="1.5"/><circle cx="820" cy="536" r="1.5"/></g>
          </g>

          <path d="M559 341q11-43 58-43c41 1 62 33 58 66-3 37-49 48-83 29" fill="#f5bdce"/>
          <path d="M583 316q-29-45-3-46 26 2 29 38" fill="#ed9fb9"/>
          <path class="ear" d="M618 318q3-52 27-43 21 10-9 48z" fill="#ed9fb9"/>
          <ellipse cx="672" cy="363" rx="31" ry="25" fill="#e996b3"/>
          <path d="M661 359v9m19-9v9" stroke="#9a5b7c" stroke-width="5"/>
          <ellipse class="eye" cx="617" cy="339" rx="4" ry="6" fill="#384455" stroke="none"/>
          <ellipse cx="607" cy="358" rx="12" ry="7" fill="#e997b2" stroke="none"/>

          </g>
        </g>
      </svg>
    </div>
    <footer><span>Good company. No particular destination.</span><button id="pause" type="button" aria-label="Pause animation" aria-pressed="false" aria-controls="scene" title="Pause animation"><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z" fill="currentColor"/></svg></button></footer>
  </main>
  <script>
    const scene = document.getElementById('scene');
    const button = document.getElementById('pause');
    button.addEventListener('click', () => {
      const paused = scene.classList.toggle('paused');
      const label = paused ? 'Resume animation' : 'Pause animation';
      button.setAttribute('aria-pressed', String(paused));
      button.setAttribute('aria-label', label);
      button.title = label;
    });
  </script>
</body>
</html>
